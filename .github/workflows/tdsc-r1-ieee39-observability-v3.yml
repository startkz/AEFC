name: TDSC-R1 four-input native IEEE39 local observability diagnostic
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-observability-v3.yml'
      - 'experiments/matlab/aefc_ieee39_local_observability_probe_v3.m'
permissions:
  contents: read
jobs:
  native_4pref_10speed_local_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical Simulink_Control_Design
          cache: true
      - name: Build original-derived true IEEE39 and compute real local A B C at two operating points
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_local_observability_probe_v3
      - name: Require error-bounded nonlinear DAE and full observation remain explicitly unproven
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          q=json.load(open('results/ieee39_safety_mapping/native_local_observability_probe_v3.json'))
          assert q['full_network_observer_verified'] is False
          assert q['bounded_nonlinear_model_residual_verified'] is False
          assert q['guaranteed_intersample_tube'] is False
          print(json.dumps(q.get('attempts',[]),indent=2))
          PY
      - name: Archive genuine native A B C and rank or observed failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-4input-local-observability-${{ github.sha }}
          path: |
            results/ieee39_safety_mapping/native_local_observability_probe_v3.json
            results/ieee39_safety_mapping/native_local_abc_t*.mat
            experiments/matlab/aefc_ieee39_local_observability_probe_v3.m
          if-no-files-found: warn
          retention-days: 90
