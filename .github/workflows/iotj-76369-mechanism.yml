name: IoT-J controlled AEFC-FRL IEEE39-118 learning smoke
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['iotj_bridge/**', '.github/workflows/iotj-76369-mechanism.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [39, 118]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent AC and learning dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile complete prototype and validate parameters
        run: |
          python -m compileall -q iotj_bridge/
          python iotj_bridge/ac_grid_validate.py --case ${{ matrix.case }} --out results/iotj_76369/case${{ matrix.case }}_validated.json
      - name: Controlled ordinary versus advantage (development smoke only)
        shell: bash
        run: |
          set -euo pipefail
          for seed in 41 42; do
            for mode in ordinary adv; do
              python iotj_bridge/run_experiment.py --case ${{ matrix.case }} --mode "$mode" --seed "$seed" --episodes 5 --out "results/iotj_76369/case${{ matrix.case }}_${mode}_${seed}.csv"
            done
          done
      - name: Adaptive utility and prototype manipulation check
        run: |
          python iotj_bridge/run_experiment.py --case ${{ matrix.case }} --mode adv --seed 42 --episodes 5 --attack joint --out results/iotj_76369/case${{ matrix.case }}_joint_42.csv
      - name: Upload full development run records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-case${{ matrix.case }}-prototype-evidence-${{ github.sha }}
          path: results/iotj_76369/
          if-no-files-found: warn
          retention-days: 90
