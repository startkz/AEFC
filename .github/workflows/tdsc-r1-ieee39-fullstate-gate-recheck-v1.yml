name: TDSC-R1 recheck IEEE39 full-state safety promotion gate v1
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-fullstate-gate-recheck-v1.yml'
      - 'experiments/audit/aefc_ieee39_fullstate_gate_recheck_v1.py'
      - 'analysis/audit_ieee39_fullstate_gate.py'
      - 'configs/ieee39_fullstate_certification_requirements.json'
      - 'results/ieee39_r2024b/interface_mapping.json'
permissions:
  contents: read
jobs:
  recheck_fullstate_gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recheck complete IEEE39 safety and physical recovery promotion gate
        shell: bash
        run: |
          set -euo pipefail
          python experiments/audit/aefc_ieee39_fullstate_gate_recheck_v1.py
      - name: Archive full-state gate recheck
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-fullstate-gate-recheck-v1
          path: |
            results/ieee39_safety_mapping/fullstate_gate_recheck_v1.json
            experiments/audit/aefc_ieee39_fullstate_gate_recheck_v1.py
          if-no-files-found: error
          retention-days: 90
