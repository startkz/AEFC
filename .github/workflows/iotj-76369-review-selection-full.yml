name: IoTJ 76369 Reviewer selection full-budget fixed-byte 10-seed
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-review-selection-full.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        case: [39,118]
        seed: [80,81,82,83,84,85,86,87,88,89]
        method: [random,td,uniform_high]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Verify local PER, algorithm, fixed-byte transport
        run: python iotj_bridge/test_strict.py
      - name: 1000 episodes 200 rounds 10 unseen test episodes
        shell: bash
        run: |
          set -euo pipefail
          out="results/iotj_review_selection/case${{ matrix.case }}/seed${{ matrix.seed }}/${{ matrix.method }}.json"
          python iotj_bridge/strict_run.py --case ${{ matrix.case }} --seed ${{ matrix.seed }} --mode ${{ matrix.method }} --hetero dim --attack clean --episodes 1000 --batch 256 --hidden 128 --latent 32 --eval-episodes 10 --clients 5 --local-steps 5 --sharing-steps 2 --kappa 0.2 --fixed-traffic --out "$out"
      - name: Independent run audit
        run: |
          python iotj_bridge/strict_audit.py --input results/iotj_review_selection/case${{ matrix.case }}/seed${{ matrix.seed }} --out results/iotj_review_selection_audit/case${{ matrix.case }}/seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-select-case${{ matrix.case }}-seed${{ matrix.seed }}-${{ matrix.method }}-${{ github.sha }}
          path: |
            results/iotj_review_selection/
            results/iotj_review_selection_audit/
          if-no-files-found: warn
          retention-days: 90
