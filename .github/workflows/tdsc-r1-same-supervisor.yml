name: TDSC-R1 same-supervisor causal ablation
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-core-chain-20261125]
    paths:
      - '.github/workflows/tdsc-r1-same-supervisor.yml'
permissions:
  contents: read
  actions: read
jobs:
  paired_same_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Run no-oracle and nonlinear interval soundness tests
        run: python -m unittest discover -s tests -p test_tdsc_contract_chain.py -v
      - name: Run same-seed Full and supervisor-only treatments
        shell: bash
        run: |
          set -euo pipefail
          for mode in full supervisor_only; do
            python -m experiments.hydro_valve.run_tdsc_contract_chain \
              --seed-start 400 --seeds 20 --mode "$mode" --stage frozen-holdout \
              --post-attack-strength 0.015 --load-stress 0.002 \
              --output "results/tdsc_pair_${mode}" | tee "run_${mode}.json"
            python -m analysis.audit_tdsc_contract_run \
              --input "results/tdsc_pair_${mode}" | tee "audit_${mode}.json"
          done
      - name: Retrieve immutable original 80-episode Full source/output
        uses: actions/download-artifact@v4
        with:
          run-id: 45533665872
          name: TDSC-R1-low-holdout-400-419-702a3b24738e0104bff64e897096469cef6784e2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: frozen_original
      - name: Verify full treatment unchanged byte-for-byte
        shell: bash
        run: |
          set -euo pipefail
          for scene in clean knowledge physical joint; do
            for seed in $(seq 400 419); do
              cmp "results/tdsc_pair_full/seed_${seed}_${scene}.jsonl" \
                  "frozen_original/results/tdsc_core_holdout_low_400_419/seed_${seed}_${scene}.jsonl"
            done
          done
          echo 'All 80 Full trajectories match the original immutable run byte-for-byte.'
      - name: Compute independent paired attribution statistics
        shell: bash
        run: |
          set -euo pipefail
          python -m analysis.compare_tdsc_same_contract \
            --full results/tdsc_pair_full \
            --supervisor results/tdsc_pair_supervisor_only \
            --output results/tdsc_paired_effects | tee paired_summary.json
      - name: Archive original traces, both treatment audits and paired statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-paired-supervisor-${{ github.sha }}
          path: |
            results/tdsc_pair_full/
            results/tdsc_pair_supervisor_only/
            results/tdsc_paired_effects/
            audit_full.json
            audit_supervisor_only.json
            paired_summary.json
            run_full.json
            run_supervisor_only.json
            analysis/compare_tdsc_same_contract.py
            experiments/hydro_valve/run_tdsc_contract_chain.py
          if-no-files-found: warn
