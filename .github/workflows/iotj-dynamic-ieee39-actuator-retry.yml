name: IoTJ native IEEE39 actuator calibration retry

on:
  push:
    branches:
      - experiment/iotj-dynamic-ieee39-20261105
    paths:
      - experiments/matlab/aefc_ieee39_dynamic_actuator_probe_retry.m
      - .github/workflows/iotj-dynamic-ieee39-actuator-retry.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iotj-dynamic-ieee39-phase-b-retry
  cancel-in-progress: false

jobs:
  actuator-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB R2024b and Simscape Electrical
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >-
            Simulink
            Simscape
            Simscape_Electrical
          cache: true

      - name: Bootstrap model and run corrected four-channel actuator calibration
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_dynamic_actuator_probe_retry

      - name: Upload immutable actuator and protection-interface evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-ieee39-dynamic-phase-b-retry-${{ github.sha }}
          path: |
            results/ieee39_r2024b/model_resolution.json
            results/ieee39_r2024b/interface_mapping.json
            results/ieee39_r2024b/dynamic_actuator_probe/
          if-no-files-found: warn
          retention-days: 90
