name: IoTJ R4 frozen aggregate-update physical gain smoke
on:
  push:
    branches: [experiment/iotj-r4-coordinate-ablation-20261111]
    paths: ['.github/workflows/iotj-r4-aggregate-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install 'pandapower==3.2.1' 'numpy==2.2.6'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and evaluate true candidate aggregate step without training feedback
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile iotj_bridge/strict_run.py
          python iotj_bridge/strict_run.py --case 39 --seed 80 \
            --mode adv --hetero dim --attack clean --episodes 10 \
            --clients 5 --malicious-clients 0 --batch 32 \
            --hidden 32 --latent 12 --local-steps 1 --sharing-steps 2 \
            --kappa .20 --eval-episodes 2 --fixed-traffic \
            --aggregate-diagnostic-rounds 1,2 --aggregate-diagnostic-profiles 1 \
            --out results/iotj_r4_aggregate_smoke/seed80.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          p=Path('results/iotj_r4_aggregate_smoke/seed80.json')
          s=json.loads(p.read_text())['summary']
          r=s['aggregate_candidate_update_impact']
          assert len(r)==2 and s['aggregate_diagnostic_rounds']==[1,2]
          assert all(x['no_training_feedback'] for x in r)
          assert all(x['same_frozen_local_adapters'] for x in r)
          assert len(set(x['scenario_seed'] for x in r))==2
          m=json.loads(p.with_suffix('.manifest.json').read_text())
          assert m['source_json_sha256']==hashlib.sha256(p.read_bytes()).hexdigest()
          assert m['checkpoint_sha256']==hashlib.sha256(p.with_suffix('.pt').read_bytes()).hexdigest()
          print('Physical gain pairing and no training-feedback smoke: PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-r4-frozen-aggregate-smoke-${{ github.sha }}
          path: results/iotj_r4_aggregate_smoke/
          if-no-files-found: warn
          retention-days: 90
