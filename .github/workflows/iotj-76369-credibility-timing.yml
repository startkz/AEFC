name: IoTJ temporal credibility and isolated delayed forgery full runs
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-credibility-timing.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iotj-credibility-timing
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [80,81,82,83,84,85,86,87,88,89]
        condition: [clean,immediate_metadata,delayed_metadata,immediate_credibility,temporal_credibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Run 100 federation rounds with a fixed 5-episode synchronization interval
        shell: bash
        run: |
          set -euo pipefail
          condition='${{ matrix.condition }}'
          case "$condition" in
            clean) attack=clean; onset=0;;
            immediate_metadata) attack=immediate_metadata; onset=1;;
            delayed_metadata) attack=delayed_metadata; onset=5;;
            immediate_credibility) attack=immediate_credibility; onset=1;;
            temporal_credibility) attack=temporal_credibility; onset=50;;
            *) exit 3;;
          esac
          out="results/iotj_credibility_timing/case39/seed${{ matrix.seed }}/${condition}.json"
          python iotj_bridge/strict_run.py \
            --case 39 --seed ${{ matrix.seed }} --mode adv --hetero dim --attack "$attack" \
            --attack-start-round "$onset" --episodes 500 --clients 5 --malicious-clients 1 \
            --batch 256 --hidden 128 --latent 32 --local-steps 5 --sharing-steps 2 \
            --kappa 0.2 --eval-episodes 10 --fixed-traffic --shift-lambda 1.0 --out "$out"
      - name: Upload immutable run JSON, checkpoint and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-credibility-case39-seed${{ matrix.seed }}-${{ matrix.condition }}-${{ github.sha }}
          path: results/iotj_credibility_timing/case39/seed${{ matrix.seed }}/${{ matrix.condition }}.*
          if-no-files-found: warn
          retention-days: 90
  audit:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audit and plotting dependencies
        run: |
          python -m pip install numpy matplotlib==3.9.2
      - uses: actions/download-artifact@v4
        with:
          pattern: iotj-credibility-case39-*
          path: credibility-artifacts/
          merge-multiple: false
      - name: Independent run and attack-phase audit; generate Figure A
        run: |
          python iotj_bridge/audit_credibility.py --timing-root credibility-artifacts --out results/iotj_credibility_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-credibility-timing-audit-${{ github.sha }}
          path: results/iotj_credibility_audit/timing/
          if-no-files-found: warn
          retention-days: 90
