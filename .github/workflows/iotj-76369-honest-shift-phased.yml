name: IoTJ staged honest demand shift paired full-budget evidence
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-honest-shift-phased.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iotj-honest-shift-phased
  cancel-in-progress: false
jobs:
  phased:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [80,81,82,83,84,85,86,87,88,89]
        variant: [no_shift,phase_round51]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed AEFC-FRL and AC experiment backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Ten seed-paired 1000-episode same-dimension phase and no-shift controls
        shell: bash
        run: |
          set -euo pipefail
          variant='${{ matrix.variant }}'
          if [ "$variant" = phase_round51 ]; then
            hetero=shift
            phase=(--shift-onset-round 50)
          else
            hetero=base
            phase=()
          fi
          out="results/iotj_honest_shift_phased/case39/seed${{ matrix.seed }}/${variant}.json"
          python iotj_bridge/strict_run.py --case 39 --seed ${{ matrix.seed }} \
            --mode adv --hetero "$hetero" --attack clean --episodes 1000 \
            --clients 5 --batch 256 --hidden 128 --latent 32 --local-steps 5 \
            --sharing-steps 2 --kappa 0.2 --eval-episodes 10 --fixed-traffic \
            --shift-lambda 1.0 "${phase[@]}" --out "$out"
      - name: Upload raw source-linked per-client physical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-phase39-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.sha }}
          path: results/iotj_honest_shift_phased/case39/seed${{ matrix.seed }}/${{ matrix.variant }}.*
          if-no-files-found: warn
          retention-days: 90
  independent-audit:
    needs: phased
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent audit dependencies
        run: python -m pip install numpy matplotlib==3.9.2
      - uses: actions/download-artifact@v4
        with:
          pattern: iotj-phase39-*
          path: phased-evidence/
          merge-multiple: false
      - name: Audit 20 checkpoints, 6-percent phase, matched seeds and difference-in-differences
        run: |
          python iotj_bridge/audit_phase_shift.py --input phased-evidence --out results/iotj_phased_shift_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-phased-shift-independent-audit-${{ github.sha }}
          path: results/iotj_phased_shift_audit/
          if-no-files-found: warn
          retention-days: 90
