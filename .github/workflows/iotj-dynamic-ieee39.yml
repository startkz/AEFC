name: IoTJ native IEEE39 dynamic frequency instrumentation

on:
  push:
    branches:
      - experiment/iotj-dynamic-ieee39-20261105
    paths:
      - experiments/IOTJ_Dynamic_IEEE39_Protocol_20261105.md
      - experiments/matlab/aefc_ieee39_dynamic_probe.m
      - .github/workflows/iotj-dynamic-ieee39.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iotj-dynamic-ieee39-phase-a
  cancel-in-progress: false

jobs:
  dynamic-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Set up MATLAB R2024b and Simscape Electrical
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: >-
            Simulink
            Simscape
            Simscape_Electrical
          cache: true

      - name: Bootstrap official MathWorks IEEE39 and run 20-second dynamic probe
        id: probe
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_dynamic_probe

      - name: Upload immutable dynamic instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-ieee39-dynamic-phase-a-${{ github.sha }}
          path: |
            results/ieee39_r2024b/model_resolution.json
            results/ieee39_r2024b/mapping_status.json
            results/ieee39_r2024b/interface_mapping.json
            results/ieee39_r2024b/bootstrap_inventory.json
            results/ieee39_r2024b/smoke_summary.json
            results/ieee39_r2024b/dynamic_probe/
          if-no-files-found: warn
          retention-days: 90
