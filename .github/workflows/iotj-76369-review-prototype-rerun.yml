name: IoTJ 76369 Reviewer no-prototype full-budget repaired rerun
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-review-prototype-rerun.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        case: [39,118]
        seed: [80,81,82]
        ablation: [no_proto,with_proto]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python iotj_bridge/test_strict.py
      - name: Matched PER training, same source SHA, only prototype alignment toggled
        shell: bash
        run: |
          set -euo pipefail
          args=(--case ${{ matrix.case }} --seed ${{ matrix.seed }} --mode adv --hetero dim --attack clean --episodes 1000 --batch 256 --hidden 128 --latent 32 --eval-episodes 10 --clients 5 --local-steps 5 --sharing-steps 2 --kappa 0.2 --fixed-traffic)
          if [ "${{ matrix.ablation }}" = no_proto ]; then
            args+=(--disable-proto)
          fi
          python iotj_bridge/strict_run.py "${args[@]}" --out "results/iotj_review_proto/case${{ matrix.case }}/seed${{ matrix.seed }}/${{ matrix.ablation }}.json"
      - run: |
          python iotj_bridge/strict_audit.py --input results/iotj_review_proto/case${{ matrix.case }}/seed${{ matrix.seed }} --out results/iotj_review_proto_audit/case${{ matrix.case }}/seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-proto-case${{ matrix.case }}-seed${{ matrix.seed }}-${{ matrix.ablation }}-${{ github.sha }}
          path: |
            results/iotj_review_proto/
            results/iotj_review_proto_audit/
          if-no-files-found: warn
          retention-days: 90
