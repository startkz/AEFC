name: AEFC v3 FROZEN independent holdout IEEE39 80-119
on:
  workflow_dispatch:
  push:
    branches: [experiment/native-v3-frozen-confirmation-80-119]
    paths: ['.github/workflows/native-v3-frozen-holdout.yml']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario:
          - {code: 1, tag: clean}
          - {code: 2, tag: knowledge}
          - {code: 4, tag: joint}
        shard:
          - {start: 80, end: 89}
          - {start: 90, end: 99}
          - {start: 100, end: 109}
          - {start: 110, end: 119}
    steps:
      - uses: actions/checkout@v4
      - name: Enforce exact frozen v3 source, config and original exploratory evaluator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object experiments/matlab/AEFCNativeOnlineRecoveryController.m)" = 4ba08ab5722b8eeb9cf30925a4bdffceb960d3e9
          test "$(git hash-object configs/ieee39_joint20.json)" = 7342b5274d6d357f4c30be0c22025abc34355adc
          test "$(git hash-object results/ieee39_r2024b/interface_mapping.json)" = f2ebdb262c872a76894f8c7408916346756186f4
          test "$(git hash-object experiments/matlab/aefc_ieee39_online_recovery.m)" = c8d802f9e19c196cfe852b02a2e8f81f6c776391
          echo "Frozen v3 git blobs checked at $(git rev-parse HEAD)"
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Rebuild and validate exact native IEEE39 mapping
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; mm=jsondecode(fileread(fullfile(pwd,'results','ieee39_r2024b','interface_mapping.json'))); assert(logical(mm.validated) && strcmp(mm.selection_policy,'paired-generator-physical-speed-v2')); aefc_ieee39_build_native_model
      - name: Run exact four frozen methods for fixed 10-seed shard
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_frozen_confirm(${{ matrix.scenario.code }},${{ matrix.shard.start }},${{ matrix.shard.end }})
      - name: Archive full original samples with SHA-256
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sub=$(printf "seeds_%03d_%03d" ${{ matrix.shard.start }} ${{ matrix.shard.end }})
          d="results/p0_native_v3_confirmation/scenario_${{ matrix.scenario.code }}/$sub"
          if [ -d "$d" ]; then
            (cd "$d" && tar -czf raw-traces.tar.gz AEFC-Unprivileged AEFC-Checkpoint AEFC-OnlineRelearn AEFC-ContractiveReentry && sha256sum raw-traces.tar.gz > raw-traces.sha256)
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEFC-Confirm-${{ matrix.scenario.tag }}-${{ matrix.shard.start }}-${{ github.sha }}
          path: results/p0_native_v3_confirmation/scenario_${{ matrix.scenario.code }}/seeds_${{ matrix.shard.start }}_${{ matrix.shard.end }}/
          if-no-files-found: warn
          retention-days: 90
  audit:
    if: always()
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: AEFC-Confirm-*
          merge-multiple: false
          path: results/p0_confirm_download
      - name: Require all 12 full raw artifacts and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          for tag in clean knowledge joint; do
            for start in 80 90 100 110; do
              shopt -s nullglob
              dirs=(results/p0_confirm_download/AEFC-Confirm-"$tag"-"$start"-*)
              test "${#dirs[@]}" -eq 1
              d="${dirs[0]}"
              (cd "$d" && sha256sum -c raw-traces.sha256)
            done
          done
      - name: Recompute all 480 full seed-traces, strict epsilon20, preserve failures
        run: python analysis/audit_native_v3_frozen_confirmation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEFC-Confirm-audit-${{ github.sha }}
          path: results/p0_native_v3_confirmation/audit/
          if-no-files-found: warn
          retention-days: 90
