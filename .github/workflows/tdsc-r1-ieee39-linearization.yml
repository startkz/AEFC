name: TDSC-R1 IEEE39 true native local system linearization readiness probe
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-ieee39-fullstate-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-linearization.yml'
      - 'experiments/matlab/aefc_ieee39_local_linearization_probe.m'
permissions:
  contents: read
jobs:
  local_native_abc:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical Simulink_Control_Design
          cache: true
      - name: Build 10-speed instrumented native benchmark and request LOCAL A B C matrices
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_local_linearization_probe
      - name: Record explicit model-scope and residual-bounds caveats
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='results/ieee39_fullstate_p0/native_linearization_probe.json'
          x=json.load(open(p))
          print(json.dumps(x,indent=2))
          assert x['full_ieee39_safety_certified'] is False
          assert x['linearization_is_complete_reachability_certificate'] is False
          PY
      - name: Archive original local state-space snapshot and all failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-local-linearization-${{ github.sha }}
          path: |
            results/ieee39_fullstate_p0/
            results/ieee39_r2024b/unprivileged_model_build.json
            experiments/matlab/aefc_ieee39_local_linearization_probe.m
          if-no-files-found: warn
          retention-days: 90
