name: Apply final methodology review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-methodology-review.yml'

permissions:
  contents: write

jobs:
  patch-methodology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed methodology edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SystemModel.tex')
          s = p.read_text()

          replacements = [
              (r'y_i=h_i(x_i)+a_i^y,', r'y_i=\mathcal H_i(x_i)+a_i^y,'),
              (r'where $a_i^y$ models observation/communication corruption, $a_i^u$ models corruption between the shield output and the plant input, and $w_i$ represents bounded modeling disturbance.',
               r'where $\mathcal H_i$ is the observation map, $a_i^y$ models observation/communication corruption, $a_i^u$ models corruption between the shield output and the plant input, and $w_i$ represents bounded modeling disturbance.'),
              (r'''\label{eq:belief}
\end{equation}

\begin{assumption}[Contractive recovery-belief dynamics]''',
               r'''\label{eq:belief}
\end{equation}
We take $\mathcal B$ to be closed and convex and $\Pi_{\mathcal B}$ to be the Euclidean projection; hence the projection used in the analysis is non-expansive.

\begin{assumption}[Contractive recovery-belief dynamics]'''),
              (r'''If poisoning stops at $T_p$ and the post-attack disturbance becomes $\epsilon_{\mathrm{clean}}$, the same recursion gives geometric correction toward an $\epsilon_{\mathrm{clean}}/(1-\lambda_b)$ neighborhood. Exact finite-time return is not claimed without an additional reset/rollback mechanism.''',
               r'''If poisoning stops at $T_p$ and the combined post-attack discrepancy entering the belief recursion is bounded by $\epsilon_{\mathrm{clean}}$, the same recursion gives geometric correction toward an $\epsilon_{\mathrm{clean}}/(1-\lambda_b)$ residual neighborhood. Exact finite-time return is not claimed without zero residual disturbance or an additional reset/rollback mechanism.'''),
              (r'''Finite correction after poisoning additionally requires either finite detection and rollback to a certified checkpoint, or a clean post-attack contraction
\begin{equation}
\|\theta_{t+1}-\theta^c\|
\le\kappa\|\theta_t-\theta^c\|+\epsilon_c,
\qquad \kappa<1.
\end{equation}
Without such an assumption, finite correction is not claimed.''',
               r'''Finite correction after poisoning additionally requires either finite detection and rollback to a certified checkpoint, or a clean post-attack contraction.
\begin{corollary}[Finite $\varepsilon$-correction after poisoning]
Suppose poisoning stops at $T_p$ and, for $t\ge T_p$,
\begin{equation}
\|\theta_{t+1}-\theta^c\|
\le\kappa\|\theta_t-\theta^c\|+\epsilon_c,
\qquad 0\le\kappa<1.
\end{equation}
Then, for every integer $s\ge0$,
\begin{equation}
\|\theta_{T_p+s}-\theta^c\|
\le \kappa^s\|\theta_{T_p}-\theta^c\|
+\frac{1-\kappa^s}{1-\kappa}\epsilon_c.
\end{equation}
Consequently, for any $\varepsilon>\epsilon_c/(1-\kappa)$, the deployed parameters enter the $\varepsilon$-ball around $\theta^c$ after finitely many clean rounds. Exact return requires $\epsilon_c=0$ or a certified rollback/reset mechanism.
\end{corollary}
\begin{proof}
Unrolling the contraction recursion for $s$ clean rounds gives the stated geometric bound. Since $\kappa^s\to0$, every radius strictly larger than the residual floor $\epsilon_c/(1-\kappa)$ is reached in finite time.
\end{proof}'''),
              (r'''\subsection{Robust Physical Execution Shield}
The authorized or fallback proposal is still not directly applied. AEFC solves''',
               r'''\subsection{Robust Physical Execution Shield}
For compactness, let $x$ and $u$ denote the stacked subsystem state and input and let $\mathcal S=\prod_i\mathcal S_i$. Assume $f$ and $g$ are locally Lipschitz, each barrier function $h_\ell$ is continuously differentiable, and $\alpha_\ell$ is an extended class-$\mathcal K$ function. The authorized or fallback proposal is still not directly applied. AEFC solves'''),
              (r'and a soft recovery CLF constraint. The actual plant receives',
               r'and a soft recovery CLF constraint that may be relaxed by $\delta$; the safety constraints remain hard. The actual plant receives'),
              (r'\text{G3: }&\text{finite $\varepsilon$-correction under explicit contraction/rollback},\\',
               r'\text{G3: }&\text{finite $\varepsilon$-correction above the residual floor under contraction/rollback},\\'),
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected methodology text not found: {old[:80]!r}')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SystemModel.tex
          git commit -m 'Tighten methodology notation and proof assumptions'
          git push origin HEAD:main
