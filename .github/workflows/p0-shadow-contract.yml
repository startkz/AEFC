name: P0 G-H same-operator shadow experiment
on:
  workflow_dispatch:
  push:
    branches: [experiment/p0-gh-shadow-contract]
    paths:
      - "experiments/run_p0_shadow_contract.py"
      - ".github/workflows/p0-shadow-contract.yml"
permissions:
  contents: read
jobs:
  shadow-g1-g3-g5:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulator dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Syntax check
        run: python -m py_compile experiments/run_p0_shadow_contract.py
      - name: Run fixed-seed shadow and post-poisoning exploratory experiment
        env:
          PYTHONPATH: .
        run: python experiments/run_p0_shadow_contract.py
      - name: Archive raw traces and summaries
        shell: bash
        run: |
          tar -czf results/p0_shadow_reduced/raw-traces.tar.gz -C results/p0_shadow_reduced knowledge joint
          sha256sum results/p0_shadow_reduced/raw-traces.tar.gz > results/p0_shadow_reduced/raw-traces.sha256
      - name: Upload complete exploratory evidence
        uses: actions/upload-artifact@v4
        with:
          name: AEFC-P0-GH-shadow-${{ github.sha }}
          path: results/p0_shadow_reduced
          if-no-files-found: error
          retention-days: 90
