name: IoTJ R4 coordinate manifest SHA256 supplement
on:
  push:
    branches: [experiment/iotj-r4-coordinate-ablation-20261111]
    paths: ['.github/workflows/iotj-r4-coordinate-manifest-audit.yml']
permissions:
  actions: read
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify the exact completed 40-cell source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iotj-r4-coordinate-evidence
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13830018801/zip" \
            -o /tmp/iotj-r4-coordinate-evidence/source.zip
          echo "4421bb8a925f27f04d14fa48ac8922ff89f6bf9da6583551ce76b975db89879f  /tmp/iotj-r4-coordinate-evidence/source.zip" | sha256sum -c -
          test "$(stat -c %s /tmp/iotj-r4-coordinate-evidence/source.zip)" = "217319441"
          unzip -q /tmp/iotj-r4-coordinate-evidence/source.zip -d /tmp/iotj-r4-coordinate-evidence/unpacked
          ROOT="$(find /tmp/iotj-r4-coordinate-evidence/unpacked -type d -name 'r4-raw' -print -quit)"
          test -n "${ROOT}"
          echo "COORD_AUDIT_ROOT=${ROOT}" >> "${GITHUB_ENV}"
      - name: Install the exact audit dependency
        run: python -m pip install 'numpy==2.2.6'
      - name: Re-run the full 40-cell physical, budget, equal-byte and censoring audit
        run: |
          set -euo pipefail
          python iotj_bridge/audit_coordinate_ablation.py \
            --root "${COORD_AUDIT_ROOT}" \
            --out results/iotj_r4_coordinate_manifest_audit/recheck
          python - <<'PY'
          import json
          p='results/iotj_r4_coordinate_manifest_audit/recheck/r4_audit_report.json'
          d=json.load(open(p))
          assert d['passed'] is True
          assert d['expected_runs']==40 and d['audited_runs']==40
          assert d['missing']==[] and d['errors']==[]
          assert d['git_source_shas']==['e674db8b7d00ce908614154bd6f3f21c1a3495ce']
          assert d['aggregate_training_episode_rows']==40000
          PY
      - name: Compute detached SHA256 for every manifest and verify all JSON/PT digests
        run: |
          set -euo pipefail
          python iotj_bridge/audit_coordinate_manifest_hashes.py \
            --root "${COORD_AUDIT_ROOT}" \
            --out results/iotj_r4_coordinate_manifest_audit
      - name: Commit only supplemental audit outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('results/iotj_r4_coordinate_manifest_audit/r4_coordinate_manifest_audit.json'))
          assert d['passed'] and d['audited_cells']==40
          assert d['detached_manifest_sha256_computed']==40
          assert d['actual_uplink_bytes_equal_across_four_methods_within_each_seed']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/iotj_r4_coordinate_manifest_audit/
          git commit -m 'IoT-J R4: record detached SHA256 for 40 coordinate manifests [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin experiment/iotj-r4-coordinate-ablation-20261111
            git rebase FETCH_HEAD
            if git push origin HEAD:refs/heads/experiment/iotj-r4-coordinate-ablation-20261111; then
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-r4-coordinate-manifest-audit-${{ github.sha }}
          path: results/iotj_r4_coordinate_manifest_audit/
          if-no-files-found: warn
          retention-days: 90
