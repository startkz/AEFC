name: IoT-J strict AEFC-FRL replay and grid smoke
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths:
      - 'iotj_bridge/strict_*.py'
      - '.github/workflows/iotj-76369-strict.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case: [39,118]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install matching numerical and torch stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate local critic, PER, and serialization invariants
        run: |
          python -m compileall -q iotj_bridge
          python iotj_bridge/test_strict.py
      - name: Perform actual 5-episode PER-AEFC smoke on AC network
        run: |
          python iotj_bridge/strict_run.py --case ${{ matrix.case }} --seed 80 --episodes 5 --batch 32 --hidden 32 --latent 16 --eval-episodes 2 --out results/iotj_strict/case${{ matrix.case }}_adv_80.json
          python iotj_bridge/strict_run.py --case ${{ matrix.case }} --seed 80 --episodes 5 --batch 32 --hidden 32 --latent 16 --mode ordinary --eval-episodes 2 --out results/iotj_strict/case${{ matrix.case }}_ordinary_80.json
      - name: Preserve successes and failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-strict-case${{ matrix.case }}-${{ github.sha }}
          path: results/iotj_strict/
          if-no-files-found: warn
          retention-days: 90
