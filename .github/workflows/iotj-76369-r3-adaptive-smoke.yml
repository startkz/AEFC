name: IoTJ R3 adaptive credibility attack smoke and invariant audit
on:
  push:
    branches: [experiment/iotj-76369-r3-adaptive-strength-20261110]
    paths: ['.github/workflows/iotj-76369-r3-adaptive-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned execution dependencies
        run: |
          python -m pip install numpy 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax and adversarial invariants
        run: |
          python -m py_compile iotj_bridge/strict_run.py iotj_bridge/adaptive_attack.py iotj_bridge/audit_adaptive_strength.py
          python iotj_bridge/test_adaptive_attack.py
          python iotj_bridge/test_strict.py
      - name: End-to-end quasi-static AC smoke (not manuscript evidence)
        run: |
          python iotj_bridge/strict_run.py --case 39 --seed 90 --mode adv \
            --hetero dim --attack adaptive_damage --attack-strength 0.50 \
            --clients 10 --malicious-clients 2 --episodes 10 \
            --batch 32 --hidden 32 --latent 12 --local-steps 1 \
            --sharing-steps 1 --kappa .20 --eval-episodes 1 \
            --fixed-traffic --attack-start-round 1 \
            --out results/iotj_r3_smoke/smoke.json
      - name: Verify smoke-level hashes and round telemetry
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('results/iotj_r3_smoke/smoke.json')
          d=json.loads(p.read_text());m=json.loads(p.with_suffix('.manifest.json').read_text())
          assert d['summary']['completed_rounds']==2
          assert len(d['train_episodes'])==10
          assert d['summary']['malicious_clients']==2
          assert len(d['rounds'][1]['per_client'])==10
          assert d['rounds'][1]['per_client'][9]['attack_search']['candidate_count']>=1
          assert hashlib.sha256(p.read_bytes()).hexdigest()==m['source_json_sha256']
          assert hashlib.sha256(p.with_suffix('.pt').read_bytes()).hexdigest()==m['checkpoint_sha256']
          print('Smoke evidence and message-level telemetry verified')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-r3-adaptive-smoke-raw-${{ github.sha }}
          path: results/iotj_r3_smoke/
          if-no-files-found: warn
          retention-days: 90
