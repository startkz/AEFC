name: IoT-J strict PER frozen-surrogate Adam diagnostics
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-strict-frozen.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        case: [39,118]
        seed: [80,81,82]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze local adapters/critics/replay and resample actual PER-Adam sharing
        run: |
          python iotj_bridge/strict_diagnostic.py --case ${{ matrix.case }} --seed ${{ matrix.seed }} --episodes 30 --draws 16 --out results/iotj_strict_frozen/case${{ matrix.case }}_seed${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-strict-frozen-case${{ matrix.case }}-seed${{ matrix.seed }}-${{ github.sha }}
          path: results/iotj_strict_frozen/
          if-no-files-found: warn
          retention-days: 90
