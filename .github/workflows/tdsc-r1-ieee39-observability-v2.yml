name: IEEE39 true native local observability A B C warmup and initial-state diagnostic
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-ieee39-decisive-evidence-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-observability-v2.yml'
      - 'experiments/matlab/aefc_ieee39_local_observability_probe_v2.m'
permissions:
  contents: read
jobs:
  native_local_observability_without_forged_state:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical Simulink_Control_Design
          cache: true
      - name: Build native IEEE39 and probe two actual model operating points
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_local_observability_probe_v2
      - name: Flag local model as incapable of proving full-state reachability without global error bounds
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('results/ieee39_safety_mapping/native_local_observability_probe_v2.json'))
          assert x['full_network_observer_verified'] is False
          assert x['index_one_DAE_validated'] is False
          assert x['bounded_nonlinear_model_residual_verified'] is False
          assert x['guaranteed_intersample_tube'] is False
          print(x['status'],x.get('attempts',[]))
          PY
      - name: Archive actual identified local A B C or original failure details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-local-observability-v2-${{ github.sha }}
          path: |
            results/ieee39_safety_mapping/native_local_observability_probe_v2.json
            results/ieee39_safety_mapping/native_local_abc_*.mat
            experiments/matlab/aefc_ieee39_local_observability_probe_v2.m
          if-no-files-found: warn
          retention-days: 90
