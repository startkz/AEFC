name: Native IEEE39 post-poisoning parameter recovery
on:
  workflow_dispatch:
  push:
    branches: [experiment/native-theta-postpoison-20261021]
    paths:
      - '.github/workflows/native-postpoison-theta.yml'
permissions:
  contents: read
jobs:
  native-postpoison:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {scenario: 2, name: knowledge}
          - {scenario: 4, name: joint}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Build validated unchanged IEEE39 physical plant
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; mm=jsondecode(fileread(fullfile(pwd,'results','ieee39_r2024b','interface_mapping.json'))); assert(logical(mm.validated) && strcmp(mm.selection_policy,'paired-generator-physical-speed-v2')); aefc_ieee39_build_native_model
      - name: Execute extended 20 seeds and 3 actual deployment methods
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_native_postpoison(${{ matrix.scenario }})
      - name: Archive complete native parameter trajectories
        shell: bash
        run: |
          cd results/p0_native_postpoison/scenario_${{ matrix.scenario }}
          tar -czf raw-traces.tar.gz FedRL AEFC-no-TGOPA AEFC-Full
          sha256sum raw-traces.tar.gz > raw-traces.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AEFC-P0-native-parameter-${{ matrix.name }}-${{ github.sha }}
          path: results/p0_native_postpoison/scenario_${{ matrix.scenario }}
          retention-days: 90
          if-no-files-found: error
