name: TDSC-R1 resolve IEEE39 three-phase fault PortConnectivity endpoints v6
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-fault-connection-v6.yml'
      - 'experiments/matlab/aefc_ieee39_fault_connection_map_v6.m'
permissions:
  contents: read
jobs:
  map_fault_portconnectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Resolve the fault's connected physical destination port handles
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_fault_connection_map_v6
      - name: Archive PortConnectivity and mapped parent block evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-fault-PortConnectivity-v6-${{ github.sha }}
          path: |
            results/ieee39_stress_r1/fault_connection_map_v6.json
            experiments/matlab/aefc_ieee39_fault_connection_map_v6.m
          if-no-files-found: warn
          retention-days: 90
