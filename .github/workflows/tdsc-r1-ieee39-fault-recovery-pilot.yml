name: TDSC-R1 native IEEE39 three-phase fault full-grid physical recovery pilot
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-fault-recovery-pilot.yml'
      - 'experiments/matlab/aefc_ieee39_native_fault_recovery_pilot.m'
      - 'configs/ieee39_native_fault_recovery_protocol_r1.json'
permissions:
  contents: read
jobs:
  native_39bus_fault_fullgrid_physical_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Run original 5.0-5.1 s temporal three-phase fault with four-input AEFC and Supervisor-only
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_native_fault_recovery_pilot
      - name: Audit full offline bus-voltage and branch-current records without converting them into online sensors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json,glob,os
          root='results/ieee39_fault_recovery_r1/pilot'
          m=json.load(open(root+'/manifest.json'))
          rows=list(csv.DictReader(open(root+'/summary.csv')))
          assert len(rows)==4
          assert m['fault_parameters_verified_at_runtime'] is True
          assert m['full_network_safety_certified'] is False
          assert m['offline_simscape_oracle_only'] is True
          for r in rows:
              assert int(r['bus_logical_ids'])==39
              assert int(r['bus_physical_sections'])>=39
              assert int(r['branch_current_series'])>0
          print(json.dumps(rows,indent=2))
          print('Full grid offline diagnostics collected; no safety certificate inferred.')
          PY
      - name: Archive complete bus voltage, ten-speed, fault and branch-current trajectories even on negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-threephase-fault-recovery-pilot-${{ github.sha }}
          path: |
            results/ieee39_fault_recovery_r1/pilot/
            configs/ieee39_native_fault_recovery_protocol_r1.json
            experiments/matlab/aefc_ieee39_native_fault_recovery_pilot.m
          if-no-files-found: warn
          retention-days: 90
