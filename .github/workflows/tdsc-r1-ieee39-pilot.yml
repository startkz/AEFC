name: TDSC-R1 IEEE39 same-supervisor six-method diagnostic pilot
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-ieee39-native-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-pilot.yml'
      - 'experiments/matlab/aefc_ieee39_unprivileged_joint.m'
      - 'analysis/compare_ieee39_unprivileged.py'
permissions:
  contents: read
jobs:
  native_six_method_paired_pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce controller no-oracle and missing full-state certificate
        shell: bash
        run: |
          set -euo pipefail
          python analysis/audit_ieee39_unprivileged.py
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Build independent native model
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_build_unprivileged
      - name: Run full six-method native diagnostic matrix
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_unprivileged_joint('pilot')
      - name: Audit actual native Simulink traces and compute paired comparisons
        shell: bash
        run: |
          set -euo pipefail
          python analysis/audit_ieee39_unprivileged.py --results results/ieee39_unpriv_r1/pilot | tee pilot_audit.json
          python analysis/compare_ieee39_unprivileged.py --results results/ieee39_unpriv_r1/pilot | tee pilot_paired.json
      - name: Preserve all native observations, failure events and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-six-method-pilot-${{ github.sha }}
          path: |
            results/ieee39_unpriv_r1/
            results/ieee39_r2024b/unprivileged_model_build.json
            pilot_audit.json
            pilot_paired.json
            configs/ieee39_unpriv_r1.json
            experiments/matlab/AEFCNativeController.m
            experiments/matlab/AEFCNativeAttackHarness.m
          if-no-files-found: warn
          retention-days: 90
