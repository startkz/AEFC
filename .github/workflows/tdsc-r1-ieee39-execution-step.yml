name: TDSC-R1 conditional full-state observer-to-actuator execution selftest
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-ieee39-fullstate-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-execution-step.yml'
      - 'experiments/matlab/aefc_native_certified_execution_step.m'
      - 'experiments/matlab/aefc_native_certified_step_selftest.m'
      - 'experiments/matlab/aefc_native_interval_observer.m'
      - 'experiments/matlab/aefc_native_full_state_contract.m'
permissions:
  contents: read
jobs:
  synthetic_closed_loop_certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true
      - name: State estimator, reachability and input release with strict fail-closed
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('experiments/matlab'); aefc_native_certified_step_selftest
      - name: Archive exact source for independent code review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-conditional-fullstate-execution-${{ github.sha }}
          path: |
            experiments/matlab/aefc_native_interval_observer.m
            experiments/matlab/aefc_native_full_state_contract.m
            experiments/matlab/aefc_native_certified_execution_step.m
            experiments/matlab/aefc_native_certified_step_selftest.m
          if-no-files-found: warn
