name: IoT-J full1000 strict equal-byte Top-k 10-seed confirmation
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-full1000-equalbyte.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iotj-full1000-equalbyte
  cancel-in-progress: false
jobs:
  equal-byte:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: [39,118]
        seed: [80,81,82,83,84,85,86,87,88,89]
        method: [adv,ordinary]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed scientific runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Check client PER, sparse padding, and server return contracts
        run: python iotj_bridge/test_strict.py
      - name: Execute full 1000 episodes and exactly 200 federated rounds
        shell: bash
        run: |
          set -euo pipefail
          out="results/iotj_full1000_equal/case${{ matrix.case }}/seed${{ matrix.seed }}/${{ matrix.method }}.json"
          python iotj_bridge/strict_run.py \
            --case ${{ matrix.case }} --seed ${{ matrix.seed }} \
            --mode ${{ matrix.method }} --hetero dim --attack clean \
            --episodes 1000 --batch 256 --hidden 128 --latent 32 \
            --eval-episodes 10 --clients 5 --local-steps 5 \
            --sharing-steps 2 --kappa 0.2 --fixed-traffic --out "$out"
      - name: Audit actual serialized bytes, full training records, held-out physical tests
        if: success()
        run: |
          python iotj_bridge/strict_audit.py \
            --input results/iotj_full1000_equal/case${{ matrix.case }}/seed${{ matrix.seed }} \
            --out results/iotj_full1000_equal_audit/case${{ matrix.case }}/seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-full-equal-case${{ matrix.case }}-seed${{ matrix.seed }}-${{ matrix.method }}-${{ github.sha }}
          path: |
            results/iotj_full1000_equal/case${{ matrix.case }}/seed${{ matrix.seed }}/
            results/iotj_full1000_equal_audit/case${{ matrix.case }}/seed${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 90
  independent-matched-seed-acceptance:
    needs: [equal-byte]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - uses: actions/download-artifact@v4
        with:
          pattern: iotj-full-equal-*
          path: collected-evidence/
          merge-multiple: true
      - name: Verify complete 10-seed 1000-episode paired grid and byte equality
        shell: bash
        run: |
          python iotj_bridge/strict_resubmission_gate.py \
            --input collected-evidence/iotj_full1000_equal/ \
            --out results/iotj_full_equal_gate/ --allow-incomplete
          python - <<'PY'
          import json,pathlib
          d=json.loads(pathlib.Path('results/iotj_full_equal_gate/gate_report.json').read_text())
          expected=['39:adv','39:ordinary','118:adv','118:ordinary']
          for k in expected:
              assert d['cases'][k]['passed_count'], (k,d['cases'][k])
          assert len(d['paired'])==2,d['paired']
          assert all(q['all_conditions_matched'] for q in d['paired'])
          print('PASS full-budget 10-paired-training-seed strict equal-byte AC validation')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-full-equal-independent-review-${{ github.sha }}
          path: results/iotj_full_equal_gate/
          if-no-files-found: warn
          retention-days: 90
