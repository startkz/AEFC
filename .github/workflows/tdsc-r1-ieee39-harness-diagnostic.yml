name: IEEE39 offline attack harness direct packet selftest
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-ieee39-fullstate-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-harness-diagnostic.yml'
      - 'experiments/matlab/AEFCNativeAttackHarness.m'
      - 'experiments/matlab/aefc_native_harness_selftest.m'
permissions:
  contents: read
jobs:
  direct_packet_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          cache: true
      - name: Run direct packet shape test without Simulink
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('experiments/matlab'); aefc_native_harness_selftest
