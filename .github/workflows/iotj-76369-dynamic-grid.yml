name: IoTJ IEEE39 dynamic transient safety evidence
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['iotj_dynamic/**', '.github/workflows/iotj-76369-dynamic-grid.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        scenario: [hold, rate_limited, step]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - name: Install pinned PowerDynamics and solver stack
        run: |
          julia --project=iotj_dynamic -e '
            using Pkg
            Pkg.add(url="https://github.com/JuliaEnergy/PowerDynamics.jl", rev="47d8034f8764a128da1549a87b5302c29b5b13f9")
            Pkg.add(["OrdinaryDiffEqRosenbrock", "OrdinaryDiffEqNonlinearSolve", "CSV", "DataFrames", "JSON"])
            Pkg.precompile()
          '
      - name: Run full IEEE39 electromechanical transient simulation
        run: |
          julia --project=iotj_dynamic iotj_dynamic/run_ieee39_dynamic.jl --scenario '${{ matrix.scenario }}' --out 'results/iotj_dynamic/${{ matrix.scenario }}'
      - name: Upload raw frequency, actuator, governor and protection traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-ieee39-dynamic-${{ matrix.scenario }}-${{ github.sha }}
          path: results/iotj_dynamic/${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 90
  independent-audit:
    needs: simulate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: iotj-ieee39-dynamic-*
          path: dynamic-artifacts/
          merge-multiple: false
      - name: Normalize artifacts and independently audit dynamic traces
        run: |
          mkdir -p results/iotj_dynamic
          for s in hold rate_limited step; do
            d=$(find dynamic-artifacts -maxdepth 1 -type d -name "iotj-ieee39-dynamic-$s-*" | head -n 1)
            test -n "$d"
            mkdir -p "results/iotj_dynamic/$s"
            cp "$d"/* "results/iotj_dynamic/$s/"
          done
          python iotj_dynamic/audit_dynamic.py results/iotj_dynamic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-ieee39-dynamic-independent-audit-${{ github.sha }}
          path: results/iotj_dynamic/
          if-no-files-found: warn
          retention-days: 90
