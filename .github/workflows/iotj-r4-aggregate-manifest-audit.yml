name: IoTJ R4 aggregate-update manifest SHA256 supplement
on:
  push:
    branches: [experiment/iotj-r4-coordinate-ablation-20261111]
    paths: ['.github/workflows/iotj-r4-aggregate-manifest-audit.yml']
permissions:
  actions: read
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download and verify the exact completed 10-seed aggregate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/iotj-r4-aggregate-evidence
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13831945798/zip" \
            -o /tmp/iotj-r4-aggregate-evidence/source.zip
          echo "759532d8f5af32122b533d5865aac7d97c86515efe98c41434db61033fb45213  /tmp/iotj-r4-aggregate-evidence/source.zip" | sha256sum -c -
          test "$(stat -c %s /tmp/iotj-r4-aggregate-evidence/source.zip)" = "54463976"
          unzip -q /tmp/iotj-r4-aggregate-evidence/source.zip -d /tmp/iotj-r4-aggregate-evidence/unpacked
          ROOT="$(find /tmp/iotj-r4-aggregate-evidence/unpacked -type d -name 'aggregate-raw' -print -quit)"
          test -n "${ROOT}"
          echo "AGG_AUDIT_ROOT=${ROOT}" >> "${GITHUB_ENV}"
      - name: Install the exact audit dependency
        run: python -m pip install 'numpy==2.2.6'
      - name: Re-run the complete 10-seed training and paired physical audit
        run: |
          set -euo pipefail
          python iotj_bridge/audit_aggregate_gain.py \
            --root "${AGG_AUDIT_ROOT}" \
            --out results/iotj_r4_aggregate_manifest_audit/recheck
          python - <<'PY'
          import json
          p='results/iotj_r4_aggregate_manifest_audit/recheck/r4_aggregate_audit.json'
          d=json.load(open(p))
          assert d['passed'] is True
          assert d['expected_training_seeds']==10 and d['audited_training_seeds']==10
          assert d['expected_paired_physical_profiles']==90 and d['audited_paired_profiles']==90
          assert d['expected_training_episode_rows']==10000
          assert d['audited_training_episode_rows']==10000
          assert d['errors']==[] and d['missing_seeds']==[]
          assert d['source_commits']==['65f28231f3c3d13d8a50893cc99f224edf670faa']
          PY
      - name: Compute detached SHA256 for every manifest and verify all JSON/PT digests
        run: |
          set -euo pipefail
          python iotj_bridge/audit_aggregate_manifest_hashes.py \
            --root "${AGG_AUDIT_ROOT}" \
            --out results/iotj_r4_aggregate_manifest_audit
      - name: Commit only supplemental audit outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          d=json.load(open('results/iotj_r4_aggregate_manifest_audit/r4_aggregate_manifest_audit.json'))
          assert d['passed'] and d['audited_seeds']==10
          assert d['detached_manifest_sha256_computed']==10
          assert d['paired_physical_profiles']==90
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/iotj_r4_aggregate_manifest_audit/
          git commit -m 'IoT-J R4: record detached SHA256 for 10 aggregate manifests [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin experiment/iotj-r4-coordinate-ablation-20261111
            git rebase FETCH_HEAD
            if git push origin HEAD:refs/heads/experiment/iotj-r4-coordinate-ablation-20261111; then
              exit 0
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-r4-aggregate-manifest-audit-${{ github.sha }}
          path: results/iotj_r4_aggregate_manifest_audit/
          if-no-files-found: warn
          retention-days: 90
