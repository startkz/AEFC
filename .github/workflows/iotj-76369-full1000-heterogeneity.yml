name: IoT-J full1000 heterogeneous adapters and prototypes
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-full1000-heterogeneity.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iotj-full1000-heterogeneity
  cancel-in-progress: false
jobs:
  full-heterogeneity:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [39,118]
        seed: [80,81,82]
        variant: [no_proto,no_adapter,mask,delay,saturation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Run mechanism and state boundary tests
        run: python iotj_bridge/test_strict.py
      - name: Full budget one factor at a time, 10 held-out episodes
        shell: bash
        run: |
          set -euo pipefail
          out="results/iotj_full1000_heterogeneity/case${{ matrix.case }}/seed${{ matrix.seed }}/${{ matrix.variant }}.json"
          args=(--case ${{ matrix.case }} --seed ${{ matrix.seed }}
                --mode adv --episodes 1000 --batch 256 --hidden 128 --latent 32
                --eval-episodes 10 --clients 5 --local-steps 5 --sharing-steps 2
                --kappa 0.2 --attack clean)
          case "${{ matrix.variant }}" in
            no_proto) args+=(--hetero dim --disable-proto);;
            no_adapter) args+=(--hetero pad_dim --disable-adapters);;
            mask) args+=(--hetero mask);;
            delay) args+=(--hetero delay);;
            saturation) args+=(--hetero saturation);;
            *) exit 3;;
          esac
          python iotj_bridge/strict_run.py "${args[@]}" --out "$out"
      - name: Independent scenario and seed integrity checks
        if: success()
        run: |
          python iotj_bridge/strict_audit.py \
             --input results/iotj_full1000_heterogeneity/case${{ matrix.case }}/seed${{ matrix.seed }} \
             --out results/iotj_full1000_heterogeneity_audit/case${{ matrix.case }}/seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-full1000-hetero-case${{ matrix.case }}-seed${{ matrix.seed }}-${{ matrix.variant }}-${{ github.sha }}
          path: |
            results/iotj_full1000_heterogeneity/case${{ matrix.case }}/seed${{ matrix.seed }}/
            results/iotj_full1000_heterogeneity_audit/case${{ matrix.case }}/seed${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 90
