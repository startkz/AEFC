name: TDSC-R1 native IEEE39 Bus16 three-phase fault recovery pilot v4
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-fault-recovery-pilot-v4.yml'
      - 'experiments/matlab/aefc_ieee39_native_fault_recovery_pilot_v4.m'
      - 'configs/ieee39_native_fault_recovery_protocol_r1.json'
permissions:
  contents: read
jobs:
  native_bus16_fault_recovery_pilot_v4:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Run the frozen original Bus16_1 three-phase fault against AEFC-Full and Supervisor-only
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_native_fault_recovery_pilot_v4
      - name: Audit 39 logical buses, 41 voltage sections, 126 native branch-current channels and recovery events
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv,json
          root='results/ieee39_fault_recovery_r1/pilot_v4'
          m=json.load(open(root+'/manifest.json'))
          rows=list(csv.DictReader(open(root+'/summary.csv')))
          assert len(rows)==4
          assert m['fault_parameters_verified_at_runtime'] is True
          assert m['full_network_safety_certified'] is False
          assert m['offline_simscape_oracle_only'] is True
          for r in rows:
              assert int(r['bus_logical_ids'])==39
              assert int(r['bus_physical_sections'])==41
              assert int(r['branch_current_series'])>=126
          print(json.dumps(rows,indent=2))
          PY
      - name: Archive complete native fault traces and branch current summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-Bus16-fault-recovery-pilot-v4-${{ github.sha }}
          path: |
            results/ieee39_fault_recovery_r1/pilot_v4/
            configs/ieee39_native_fault_recovery_protocol_r1.json
            experiments/matlab/aefc_ieee39_native_fault_recovery_pilot_v4.m
          if-no-files-found: warn
          retention-days: 90
