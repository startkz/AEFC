name: IoT-J full1000 joint poisoning and honest shift
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-full1000-robustness.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: iotj-full1000-robustness
  cancel-in-progress: false
jobs:
  full-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        case: [39,118]
        seed: [80,81,82]
        study: [joint_uncapped,joint_cap035,delayed_joint,honest_shift]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Recheck strict algorithm invariants
        run: python iotj_bridge/test_strict.py
      - name: Execute 1000 matched training episodes and independent test set
        shell: bash
        run: |
          set -euo pipefail
          out="results/iotj_full1000_robust/case${{ matrix.case }}/seed${{ matrix.seed }}/${{ matrix.study }}.json"
          args=(--case ${{ matrix.case }} --seed ${{ matrix.seed }} --mode adv --episodes 1000
                --batch 256 --hidden 128 --latent 32 --eval-episodes 10
                --clients 5 --local-steps 5 --sharing-steps 2 --kappa 0.2)
          case "${{ matrix.study }}" in
            joint_uncapped) args+=(--hetero dim --attack joint);;
            joint_cap035) args+=(--hetero dim --attack joint --weight-cap 0.35);;
            delayed_joint) args+=(--hetero dim --attack delayed_joint);;
            honest_shift) args+=(--hetero shift --attack clean);;
            *) exit 3;;
          esac
          python iotj_bridge/strict_run.py "${args[@]}" --out "$out"
      - name: Independent seed-level evidence verification
        if: success()
        run: |
          python iotj_bridge/strict_audit.py \
             --input results/iotj_full1000_robust/case${{ matrix.case }}/seed${{ matrix.seed }} \
             --out results/iotj_full1000_robust_audit/case${{ matrix.case }}/seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-full1000-robust-case${{ matrix.case }}-seed${{ matrix.seed }}-${{ matrix.study }}-${{ github.sha }}
          path: |
            results/iotj_full1000_robust/case${{ matrix.case }}/seed${{ matrix.seed }}/
            results/iotj_full1000_robust_audit/case${{ matrix.case }}/seed${{ matrix.seed }}/
          if-no-files-found: warn
          retention-days: 90
