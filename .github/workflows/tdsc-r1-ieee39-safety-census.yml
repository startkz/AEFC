name: IEEE39 native bus/branch/angle trusted-observation coverage census
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-ieee39-decisive-evidence-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-safety-census.yml'
      - 'experiments/matlab/aefc_ieee39_safety_signal_census.m'
permissions:
  contents: read
jobs:
  discover_real_physical_observation_candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Scan exact official IEEE39 real signal edges (candidate discovery only)
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_safety_signal_census
      - name: Verify no candidate was silently promoted into trusted full-state safety certificate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('results/ieee39_safety_mapping/native_safety_signal_census.json'))
          assert x['scanned_blocks']>0
          assert x['verified_bus_voltage_channels']==0
          assert x['verified_branch_thermal_channels']==0
          assert x['verified_full_state_estimator_error_set'] is False
          assert x['verified_DAE_reachable_set'] is False
          assert all(not e['online_authenticated_sensor'] for e in x['entries'])
          print('Observed physical signal candidates', x['candidates_by_category'])
          print('Real IEEE39 full-state certification: INCOMPLETE')
          PY
      - name: Archive full source candidate mapping and coverage gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-safety-sensor-census-${{ github.sha }}
          path: |
            results/ieee39_safety_mapping/native_safety_signal_census.json
            experiments/matlab/aefc_ieee39_safety_signal_census.m
          if-no-files-found: warn
          retention-days: 90
