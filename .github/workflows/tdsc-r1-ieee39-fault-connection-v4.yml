name: TDSC-R1 map the original IEEE39 three-phase fault to its connected physical bus
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-fault-connection-v4.yml'
      - 'experiments/matlab/aefc_ieee39_fault_connection_map_v4.m'
permissions:
  contents: read
jobs:
  physical_fault_bus_connection:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Match fault port connection line handle against all physical ports in Grid
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_fault_connection_map_v4
      - name: Preserve unresolved location honestly
        shell: bash
        run: |
          set -euo pipefail
          test -s results/ieee39_stress_r1/fault_connection_map_v4.json
          python - <<'PY'
          import json
          x=json.load(open('results/ieee39_stress_r1/fault_connection_map_v4.json'))
          print(json.dumps(x,indent=2))
          assert x['online_measurement_trusted'] is False
          assert x['full_network_safety_certified'] is False
          PY
      - name: Archive fault location evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-fault-location-v4-${{ github.sha }}
          path: |
            results/ieee39_stress_r1/fault_connection_map_v4.json
            experiments/matlab/aefc_ieee39_fault_connection_map_v4.m
          if-no-files-found: warn
          retention-days: 90
