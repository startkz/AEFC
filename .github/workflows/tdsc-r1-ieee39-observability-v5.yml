name: TDSC-R1 native IEEE39 four-input ten-speed local controllability-observability v5
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-observability-v5.yml'
      - 'experiments/matlab/aefc_ieee39_local_observability_probe_v5.m'
permissions:
  contents: read
jobs:
  native_physical_4input_10speed_local_ABCD:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical Simulink_Control_Design
          cache: true
      - name: Linearize actual four native Pref correction sum inputs to all ten rotor speed outputs
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_local_observability_probe_v5
      - name: Require true 4-input/10-output linearization and inspect local rank without upgrading to global certificate
        shell: bash
        run: |
          set -euo pipefail
          test -s results/ieee39_safety_mapping/native_local_observability_probe_v5.json
          python - <<'PY'
          import json
          q=json.load(open('results/ieee39_safety_mapping/native_local_observability_probe_v5.json'))
          print('I/O:',q.get('linearization_input_definition'),q.get('linearization_output_definition'))
          print('Attempts:',json.dumps(q.get('attempts',[]),indent=2))
          assert len(q.get('attempts',[]))==2
          assert all(a['physical_input_channels']==4 for a in q['attempts'])
          assert all(a['observed_speed_channels']==10 for a in q['attempts'])
          assert all(a['finite_linearization'] for a in q['attempts'])
          assert q['full_network_observer_verified'] is False
          assert q['bounded_nonlinear_model_residual_verified'] is False
          assert q['guaranteed_intersample_tube'] is False
          PY
      - name: Archive A B C D, singular spectra, local ranks and all limitations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-4input-10speed-ABCD-v5-${{ github.sha }}
          path: |
            results/ieee39_safety_mapping/native_local_observability_probe_v5.json
            results/ieee39_safety_mapping/native_local_abc_t*.mat
            experiments/matlab/aefc_ieee39_local_observability_probe_v5.m
          if-no-files-found: warn
          retention-days: 90
