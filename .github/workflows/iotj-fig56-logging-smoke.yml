name: IoTJ Fig5-6 recorded-trajectory logger smoke
on:
  push:
    branches: [experiment/iotj-fig56-episode-traces-20261111]
    paths: ['.github/workflows/iotj-fig56-logging-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logger-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fixed Python dependencies
        run: |
          python -m pip install 'pandapower==3.2.1' 'numpy==2.2.6' 'matplotlib==3.9.2'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Syntax and original learner regression tests
        run: |
          python -m py_compile iotj_bridge/strict_run.py iotj_bridge/strict_agent.py iotj_bridge/audit_fig56_episode_traces.py
          python iotj_bridge/test_strict.py
      - name: Test per-episode log for every supported AC curve method
        shell: bash
        run: |
          set -euo pipefail
          for method in adv ordinary adv_no_cw dense dense_cw; do
            out="results/iotj_fig56_smoke/${method}.json"
            python iotj_bridge/strict_run.py \
              --case 39 --seed 80 --mode "$method" --hetero dim --attack clean \
              --episodes 10 --clients 5 --malicious-clients 0 \
              --batch 32 --hidden 32 --latent 12 --local-steps 1 \
              --sharing-steps 1 --kappa 0.2 --eval-episodes 2 \
              --record-training-trace --out "$out"
          done
      - name: Independently recompute recovery step from each recorded trajectory
        shell: bash
        run: |
          python - <<'PY'
          import glob,hashlib,json
          for path in sorted(glob.glob('results/iotj_fig56_smoke/*.json')):
              if path.endswith('.manifest.json'):continue
              d=json.load(open(path));s=d['summary']
              assert s['record_training_trace']==1 and len(d['train_episodes'])==10
              meta=json.load(open(path.replace('.json','.manifest.json')))
              assert hashlib.sha256(open(path,'rb').read()).hexdigest()==meta['source_json_sha256']
              assert hashlib.sha256(open(path.replace('.json','.pt'),'rb').read()).hexdigest()==meta['checkpoint_sha256']
              for ep in d['train_episodes']:
                  tr=ep['trace']
                  assert 0<len(tr)<=30
                  assert len(tr)==ep['steps_executed']
                  streak=0;first=-1
                  for z in tr:
                      streak=streak+1 if z['safe'] and z['ac_converged'] and z['restored_pct']>=90 else 0
                      if first<0 and streak>=5:first=z['t']-4
                  assert first==ep['recovery_step']
                  assert ep['censored']==int(first<0)
                  assert abs(tr[-1]['restored_pct']-ep['recovery_accuracy_pct'])<1e-7
              print(path,'episodes',len(d['train_episodes']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-fig56-smoke-${{ github.sha }}
          path: results/iotj_fig56_smoke/
          if-no-files-found: warn
          retention-days: 90
