name: TDSC-R1 native IEEE39 Bus16 port-current fault probe v1
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-bus16-port-current-fault-probe-v1.yml'
      - 'experiments/matlab/aefc_ieee39_bus16_port_current_fault_probe_v1.m'
      - 'experiments/audit/aefc_ieee39_bus16_port_current_fault_probe_audit_v1.py'
      - 'experiments/matlab/aefc_ieee39_build_stress.m'
      - 'configs/ieee39_native_fault_recovery_protocol_r1.json'
permissions:
  contents: read
jobs:
  bus16_port_fault_probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Run one strict Bus16 fault episode and capture I# port currents
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_bus16_port_current_fault_probe_v1
      - name: Audit Bus16 port current coverage
        shell: bash
        run: |
          set -euo pipefail
          python experiments/audit/aefc_ieee39_bus16_port_current_fault_probe_audit_v1.py
      - name: Archive Bus16 port current fault probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-Bus16-port-current-fault-probe-v1
          path: |
            results/ieee39_safety_mapping/native_ieee39_bus16_port_current_fault_probe_v1.json
            results/ieee39_safety_mapping/bus16_port_current_fault_probe_audit_v1.json
            experiments/matlab/aefc_ieee39_bus16_port_current_fault_probe_v1.m
            experiments/audit/aefc_ieee39_bus16_port_current_fault_probe_audit_v1.py
          if-no-files-found: warn
          retention-days: 90
