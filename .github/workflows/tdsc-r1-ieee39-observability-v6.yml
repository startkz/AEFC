name: TDSC-R1 native IEEE39 local controllability-observability v6 with four model-root correction inputs
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-observability-v6.yml'
      - 'experiments/matlab/aefc_ieee39_local_observability_probe_v6.m'
permissions:
  contents: read
jobs:
  native_physical_4input_10speed_local_ABCD_v6:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical Simulink_Control_Design
          cache: true
      - name: Linearize four valid shield Goto inputs to ten original generator rotor speed outputs
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_local_observability_probe_v6
      - name: Inspect true 4-input/10-output local ABCD and rank without asserting global DAE safety
        shell: bash
        run: |
          set -euo pipefail
          test -s results/ieee39_safety_mapping/native_local_observability_probe_v6.json
          python - <<'PY'
          import json
          q=json.load(open('results/ieee39_safety_mapping/native_local_observability_probe_v6.json'))
          print('I/O:',q.get('linearization_input_definition'),q.get('linearization_output_definition'))
          print('Attempts:',json.dumps(q.get('attempts',[]),indent=2))
          assert len(q.get('attempts',[]))==2
          assert all(a['physical_input_channels']==4 for a in q['attempts'])
          assert all(a['observed_speed_channels']==10 for a in q['attempts'])
          assert all(a['finite_linearization'] for a in q['attempts'])
          assert q['full_network_observer_verified'] is False
          assert q['bounded_nonlinear_model_residual_verified'] is False
          assert q['guaranteed_intersample_tube'] is False
          PY
      - name: Archive actual matrices and local rank spectra or failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-4input-10speed-ABCD-v6-${{ github.sha }}
          path: |
            results/ieee39_safety_mapping/native_local_observability_probe_v6.json
            results/ieee39_safety_mapping/native_local_abc_t*.mat
            experiments/matlab/aefc_ieee39_local_observability_probe_v6.m
          if-no-files-found: warn
          retention-days: 90
