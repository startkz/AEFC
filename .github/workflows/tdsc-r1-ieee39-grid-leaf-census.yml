name: TDSC-R1 native IEEE39 actual Simscape Grid physical v/i leaf series census
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-grid-leaf-census.yml'
      - 'experiments/matlab/aefc_ieee39_grid_physical_leaf_census.m'
permissions:
  contents: read
jobs:
  official_grid_electrical_physical_leaf_nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Inspect every original IEEE39 Simscape v/i electrical series including Grid hierarchy
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_grid_physical_leaf_census
      - name: Ensure no offline Simscape leaf was granted trusted online measurement status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          x=json.load(open('results/ieee39_safety_mapping/native_grid_physical_leaf_census.json'))
          print('Status:',x['status'])
          print('Grid physical series:',x['grid_leaf_paths'])
          print('Voltage-like leaves:',x['grid_voltage_like_leaf_paths'])
          print('Current-like leaves:',x['grid_current_like_leaf_paths'])
          assert x['all_entries_offline_simscape_oracle_only'] is True
          assert x['full_IEEE39_DAE_state_estimation_certified'] is False
          assert x['rigorous_nonlinear_reachability_certified'] is False
          assert x['specific_39_bus_voltage_channels_trusted']==0
          assert x['specific_branch_thermal_channels_trusted']==0
          PY
      - name: Archive true original Simscape grid variable names, units and all blockers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-native-grid-electrical-leaves-${{ github.sha }}
          path: |
            results/ieee39_safety_mapping/native_grid_physical_leaf_census.json
            experiments/matlab/aefc_ieee39_grid_physical_leaf_census.m
          if-no-files-found: warn
          retention-days: 90
