name: TDSC-R1 true native IEEE39 strict rejection, Pref baseline and intersample physical witness
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-ieee39-decisive-evidence-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-pref-fallback.yml'
      - 'experiments/matlab/aefc_ieee39_build_unprivileged.m'
      - 'experiments/matlab/aefc_ieee39_unprivileged_joint.m'
      - 'analysis/audit_ieee39_unprivileged.py'
permissions:
  contents: read
jobs:
  original_native_pref_fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure strict controller cannot access attack oracle
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile analysis/audit_ieee39_unprivileged.py
          python analysis/audit_ieee39_unprivileged.py
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Build official real IEEE39 with base Pref and delivered Pref actual signal witnesses
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_build_unprivileged
      - name: Execute eight real Simulink strict-fail-closed attack cases
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_unprivileged_joint('strict')
      - name: Independently audit original plus delivered Pref, true physical speeds, raw solver-time and attack budget
        shell: bash
        run: |
          set -euo pipefail
          python analysis/audit_ieee39_unprivileged.py --results results/ieee39_unpriv_r1/strict | tee strict_pref_audit.json
      - name: Archive full original physical and actuator raw evidence regardless of pass
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-strict-pref-fallback-${{ github.sha }}
          path: |
            results/ieee39_unpriv_r1/strict/
            results/ieee39_r2024b/unprivileged_model_build.json
            strict_pref_audit.json
            experiments/matlab/aefc_ieee39_build_unprivileged.m
            experiments/matlab/aefc_ieee39_unprivileged_joint.m
            experiments/matlab/AEFCNativeController.m
          if-no-files-found: warn
          retention-days: 90
