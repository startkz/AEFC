name: TDSC-R1 locate original IEEE39 native three-phase fault physical connection and actual line/load blocks v3
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-event-interface-v3.yml'
      - 'experiments/matlab/aefc_ieee39_physical_event_interface_inventory_v3.m'
permissions:
  contents: read
jobs:
  native_fault_physical_connection_and_loads:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Resolve physical port line endpoints and enumerate true line/transformer/load components
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_physical_event_interface_inventory_v3
      - name: Archive actual block parameters and physical wiring; do not grant fault location without endpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-fault-physical-connection-v3-${{ github.sha }}
          path: |
            results/ieee39_stress_r1/physical_event_interface_inventory_v3.json
            experiments/matlab/aefc_ieee39_physical_event_interface_inventory_v3.m
          if-no-files-found: warn
          retention-days: 90
