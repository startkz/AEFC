name: IoT-J controlled heterogeneity and poisoning grid pilot
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['iotj_bridge/**', '.github/workflows/iotj-76369-extended.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grid-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [39, 118]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate both benchmark identities and power-flow interface
        run: |
          python -m compileall -q iotj_bridge
          python iotj_bridge/ac_grid_validate.py --case ${{ matrix.case }} --out results/iotj_76369/case${{ matrix.case }}_verification.json
      - name: Execute five paired seeds, same input/compute and communication budget
        shell: bash
        run: |
          set -euo pipefail
          for seed in 41 42 43 44 45; do
            for method in adv ordinary random td; do
              python iotj_bridge/run_experiment.py --case ${{ matrix.case }} --seed "$seed" --mode "$method" --episodes 12 --hetero dim --out "results/iotj_76369/${method}_dim_${seed}.csv"
            done
            python iotj_bridge/run_experiment.py --case ${{ matrix.case }} --seed "$seed" --mode adv --episodes 12 --hetero dim --disable-proto --out "results/iotj_76369/adv_dim_no_proto_${seed}.csv"
            python iotj_bridge/run_experiment.py --case ${{ matrix.case }} --seed "$seed" --mode adv --episodes 12 --attack joint --out "results/iotj_76369/adv_joint_${seed}.csv"
            python iotj_bridge/run_experiment.py --case ${{ matrix.case }} --seed "$seed" --mode adv --episodes 12 --attack joint --weight-cap 0.35 --out "results/iotj_76369/adv_joint_capped_${seed}.csv"
            python iotj_bridge/run_experiment.py --case ${{ matrix.case }} --seed "$seed" --mode adv --episodes 12 --hetero shift --out "results/iotj_76369/adv_honest_shift_${seed}.csv"
          done
      - name: Archive all pilot records including failed/reached targets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-case${{ matrix.case }}-controlled-pilot-${{ github.sha }}
          path: results/iotj_76369/
          if-no-files-found: warn
          retention-days: 90
