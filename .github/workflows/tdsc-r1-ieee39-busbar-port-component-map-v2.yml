name: TDSC-R1 native IEEE39 physical Busbar port map v2
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-busbar-port-component-map-v2.yml'
      - 'experiments/matlab/aefc_ieee39_busbar_port_component_map_v2.m'
      - 'experiments/audit/aefc_ieee39_busbar_port_component_map_audit_v2.py'
permissions:
  contents: read
jobs:
  native_busbar_port_map:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Map original IEEE39 physical Busbar ports using interleaved I# candidates
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_busbar_port_component_map_v2
      - name: Audit 123-port topology and I# candidate formula
        shell: bash
        run: |
          set -euo pipefail
          python experiments/audit/aefc_ieee39_busbar_port_component_map_audit_v2.py
      - name: Archive corrected original-model physical port map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-busbar-port-component-map-v2
          path: |
            results/ieee39_safety_mapping/native_busbar_port_component_map_v2.json
            results/ieee39_safety_mapping/busbar_port_component_map_audit_v2.json
            experiments/matlab/aefc_ieee39_busbar_port_component_map_v2.m
            experiments/audit/aefc_ieee39_busbar_port_component_map_audit_v2.py
          if-no-files-found: warn
          retention-days: 90
