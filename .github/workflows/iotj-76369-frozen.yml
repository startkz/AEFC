name: IoT-J frozen actual optimizer direction diagnostics
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['iotj_bridge/frozen_diagnostics.py', '.github/workflows/iotj-76369-frozen.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        case: [39,118]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Freeze trained local surrogates, resample batches and compute diagnostics
        shell: bash
        run: |
          set -euo pipefail
          for seed in 41 42 43; do
            python iotj_bridge/frozen_diagnostics.py --case ${{ matrix.case }} --seed "$seed" --episodes 12 --draws 16 --out "results/iotj_76369_frozen/case${{ matrix.case }}_seed${seed}.json"
          done
      - name: Archive actual snapshot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-frozen-case${{ matrix.case }}-${{ github.sha }}
          path: results/iotj_76369_frozen/
          if-no-files-found: warn
          retention-days: 90
