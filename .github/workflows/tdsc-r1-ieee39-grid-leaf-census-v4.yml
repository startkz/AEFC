name: TDSC-R1 complete IEEE39 offline 39-bus voltage and 46-branch current census v4
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-grid-leaf-census-v4.yml'
      - 'experiments/matlab/aefc_ieee39_grid_physical_leaf_census_v4.m'
permissions:
  contents: read
jobs:
  original_grid_full_physical_leaf_values:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Extract 39 logical bus Vt and all transmission-line phase and transformer current values
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_grid_physical_leaf_census_v4
      - name: Require 39 logical buses, 41 physical sections and native line/transformer current series
        shell: bash
        run: |
          set -euo pipefail
          test -s results/ieee39_safety_mapping/native_grid_physical_leaf_census_v4.json
          python - <<'PY'
          import json
          x=json.load(open('results/ieee39_safety_mapping/native_grid_physical_leaf_census_v4.json'))
          print({k:x[k] for k in ('status','logical_bus_ids_with_Vt','physical_bus_voltage_sections','line_components_with_current','line_current_leaf_rows','transformer_components_with_current','transformer_current_leaf_rows','branch_loss_leaf_rows','truncated')})
          if x['status']!='OFFLINE_PHYSICAL_GRID_LEAF_VALUES_EXTRACTED':
              print(x.get('error_id'),x.get('error_message'),x.get('error_stack'))
              raise SystemExit(1)
          assert x['logical_bus_ids_with_Vt']==39
          assert x['physical_bus_voltage_sections']==41
          assert x['line_components_with_current']>=1
          assert x['transformer_components_with_current']==12
          assert x['all_entries_offline_simscape_oracle_only'] is True
          assert x['full_network_online_observer_verified'] is False
          assert x['rigorous_nonlinear_reachability_certified'] is False
          assert not x['truncated']
          assert all(e['finite'] for e in x['entries'])
          PY
      - name: Archive full physical variable names, units, time spans and values
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-39bus-46branch-physical-census-v4-${{ github.sha }}
          path: |
            results/ieee39_safety_mapping/native_grid_physical_leaf_census_v4.json
            experiments/matlab/aefc_ieee39_grid_physical_leaf_census_v4.m
          if-no-files-found: warn
          retention-days: 90
