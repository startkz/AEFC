name: TDSC-R1 IEEE39 six-method true native 10-generator-speed pilot
on:
  workflow_dispatch:
  push:
    branches: [audit/tdsc-r1-ieee39-fullstate-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-sixmethod-short.yml'
permissions:
  contents: read
jobs:
  six_method_same_supervisor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit controller no oracle and full-state claim lock
        shell: bash
        run: |
          set -euo pipefail
          python analysis/audit_ieee39_unprivileged.py
          python -m unittest discover -s tests -p test_ieee39_fullstate_gate.py -v
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Build official native plant and ten-generator speed monitor
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_build_unprivileged
      - name: Run six true-Simulink methods with same terminal execution checker
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_unprivileged_joint('pilot_short')
      - name: Independent 4-sensor and all-10-generator physical recovery audit
        shell: bash
        run: |
          set -euo pipefail
          python analysis/audit_ieee39_unprivileged.py --results results/ieee39_unpriv_r1/pilot_short | tee pilot_short_audit.json
          python analysis/compare_ieee39_unprivileged.py --results results/ieee39_unpriv_r1/pilot_short | tee pilot_short_paired.json
      - name: Archive 24 episodes including failed/no-exposure trajectories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-sixmethod-10gen-short-${{ github.sha }}
          path: |
            results/ieee39_unpriv_r1/
            results/ieee39_r2024b/unprivileged_model_build.json
            pilot_short_audit.json
            pilot_short_paired.json
            configs/ieee39_unpriv_r1.json
            experiments/matlab/aefc_ieee39_attach_all_generator_speeds.m
          if-no-files-found: warn
          retention-days: 90
