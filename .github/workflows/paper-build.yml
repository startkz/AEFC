name: Build AEFC manuscript PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.tex'
      - 'ref.bib'
      - '**.pdf'
      - '**.eps'
      - '.github/workflows/paper-build.yml'

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile IEEE manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Validate final LaTeX log
        shell: bash
        run: |
          set -euo pipefail
          test -s main.pdf
          test -s main.log
          if grep -Eiq 'undefined citations?|undefined references?|Citation .* undefined|Reference .* undefined|There were undefined references' main.log; then
            echo 'Undefined citation/reference detected.' >&2
            exit 1
          fi
          if grep -Eiq 'Overfull \\hbox|Overfull \\vbox' main.log; then
            echo 'Overfull box detected.' >&2
            grep -Ei 'Overfull \\hbox|Overfull \\vbox' main.log >&2 || true
            exit 1
          fi
          if grep -Eiq '^! |LaTeX Error|Fatal error|Emergency stop' main.log; then
            echo 'LaTeX error detected.' >&2
            exit 1
          fi
          echo 'Final log validation passed: 0 undefined citations/references, 0 overfull boxes, 0 LaTeX errors.'

      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aefc-paper-build-log-${{ github.sha }}
          path: |
            main.log
            main.blg
          if-no-files-found: ignore

      - name: Upload manuscript PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AEFC-TDSC-manuscript-${{ github.sha }}
          path: main.pdf
          if-no-files-found: error

      - name: Publish reviewed PDF to main
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp main.pdf AEFC-TDSC-final.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AEFC-TDSC-final.pdf
          if git diff --cached --quiet; then
            echo 'AEFC-TDSC-final.pdf is already current.'
            exit 0
          fi
          git commit -m 'Publish final reviewed manuscript PDF [skip ci]'
          git push origin HEAD:main
