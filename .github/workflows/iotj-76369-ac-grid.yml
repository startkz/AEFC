name: IoT-J IEEE39-118 AC grid interface validation
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['iotj_bridge/**', '.github/workflows/iotj-76369-ac-grid.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-standard-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: [39, 118]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible AC power-flow simulator
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
      - name: Run deterministic case and safety-interface validation
        run: |
          python iotj_bridge/ac_grid_validate.py --case ${{ matrix.case }} --out results/iotj_76369/case${{ matrix.case }}_ac_validation.json
      - name: Upload actual validation traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iotj-case${{ matrix.case }}-ac-validation-${{ github.sha }}
          path: results/iotj_76369/
          if-no-files-found: warn
          retention-days: 90
