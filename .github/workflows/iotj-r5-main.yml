name: IoTJ R5 10-seed statistical validation
on:
  push:
    branches: [experiment/iotj-r4-coordinate-ablation-20261111]
    paths: ['.github/workflows/iotj-r5-main.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iotj-r5-main-validation
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AC and learning dependencies
        run: |
          python -m pip install 'pandapower==3.2.1' 'numpy==2.2.6'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Validate changed training paths before full-budget runs
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile iotj_bridge/reviewer_r5_run.py iotj_bridge/audit_reviewer_r5.py
          for control in adv maddpg_ac; do
            python iotj_bridge/reviewer_r5_run.py --study main --seed 80 --control "$control" --factor r5_1111 --episodes 10 --eval-episodes 2 --out "smoke/$control.json"
          done
          PYTHONPATH=iotj_bridge python - <<'PY'
          import json
          from pathlib import Path
          from audit_reviewer_r5 import episode
          for p in Path("smoke").glob("*.json"):
              if p.name.endswith(".manifest.json"): continue
              d=json.loads(p.read_text()); s=d["summary"]
              assert len(d["train_episodes"])==10 and len(d["tests"])==2
              for ep in d["train_episodes"]+d["tests"]:
                  episode(ep, None)
          PY
  train1:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [80,81,82,83,84,85,86,87,88,89]
        control: [adv,ordinary,adv_no_cw,dense,dense_cw,maddpg_ac]
        factor: [dim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned AC and learning dependencies
        run: |
          python -m pip install 'pandapower==3.2.1' 'numpy==2.2.6'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Execute one full-budget training cell
        shell: bash
        run: |
          set -euo pipefail
          python iotj_bridge/reviewer_r5_run.py --study main --seed ${{ matrix.seed }} --control ${{ matrix.control }} --factor ${{ matrix.factor }} --out raw/run.json
      - name: Audit all raw physical steps and checkpoint hashes
        run: python iotj_bridge/audit_reviewer_r5.py --study main --one --root raw/run.json --out audited/record.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-main-raw-${{ matrix.seed }}-${{ matrix.factor }}-${{ matrix.control }}
          path: raw/
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: r5-main-audited-${{ matrix.seed }}-${{ matrix.factor }}-${{ matrix.control }}
          path: audited/record.json
          if-no-files-found: error
          retention-days: 90
  summarize:
    needs: [train1]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.2.6'
      - uses: actions/download-artifact@v4
        with:
          pattern: r5-main-audited-*
          path: r5-audited/
          merge-multiple: false
      - name: Require every predeclared paired seed and compute intervals and tests
        run: python iotj_bridge/audit_reviewer_r5.py --study main --records-only --root r5-audited --out results/iotj_r5_main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-main-results-${{ github.sha }}
          path: results/iotj_r5_main/
          if-no-files-found: warn
          retention-days: 90
      - name: Publish only complete audited statistics
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import json; a=json.load(open("results/iotj_r5_main/audit.json")); assert a["passed"] and a["audited_runs"]==60'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/iotj_r5_main/
          git commit -m 'IoTJ R5: archive complete main statistics [skip ci]'
          for n in 1 2 3 4 5; do
            git fetch origin experiment/iotj-r4-coordinate-ablation-20261111
            git rebase FETCH_HEAD
            if git push origin HEAD:refs/heads/experiment/iotj-r4-coordinate-ablation-20261111; then exit 0; fi
          done
          exit 1

