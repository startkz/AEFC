name: TDSC-R1 inspect actual IEEE39 three-phase fault and physical event interfaces
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-event-interface-v2.yml'
      - 'experiments/matlab/aefc_ieee39_physical_event_interface_inventory_v2.m'
permissions:
  contents: read
jobs:
  native_fault_load_line_interface_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Read actual Fault Three-Phase mask values, ports, connection and load/branch block parameters
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_physical_event_interface_inventory_v2
      - name: Archive actual physical event block settings without presuming validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-IEEE39-real-fault-load-branch-parameters-${{ github.sha }}
          path: |
            results/ieee39_stress_r1/physical_event_interface_inventory_v2.json
            experiments/matlab/aefc_ieee39_physical_event_interface_inventory_v2.m
          if-no-files-found: warn
          retention-days: 90
