name: TDSC-R1 unprivileged SIL execution-contract recovery audit
on:
  workflow_dispatch:
  push:
    branches:
      - audit/tdsc-r1-core-chain-20261125
    paths:
      - 'experiments/hydro_valve/run_tdsc_contract_chain.py'
      - 'tests/test_tdsc_contract_chain.py'
      - 'analysis/audit_tdsc_core_legacy.py'
      - 'docs/TDSC_R1_CORE_CHAIN_AUDIT_20261125.md'
      - '.github/workflows/tdsc-r1-core-chain.yml'
permissions:
  contents: read
jobs:
  discrete_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Audit historical source without altering old data
        run: python analysis/audit_tdsc_core_legacy.py | tee legacy_audit.json
      - name: Unit and randomized model inclusion checks
        run: python -m unittest discover -s tests -p test_tdsc_contract_chain.py -v
      - name: Run ten matched seeds on original HydroPlant
        run: python -m experiments.hydro_valve.run_tdsc_contract_chain --seed-start 240 --seeds 10 --output results/tdsc_core_chain_v1 | tee run_summary.json
      - name: Upload complete original traces (including negative outcomes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-core-chain-${{ github.sha }}
          path: |
            results/tdsc_core_chain_v1/
            legacy_audit.json
            run_summary.json
          if-no-files-found: warn
