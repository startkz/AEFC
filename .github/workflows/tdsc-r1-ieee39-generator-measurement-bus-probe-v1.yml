name: TDSC-R1 runtime probe native IEEE39 generator measurement bus v1
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-generator-measurement-bus-probe-v1.yml'
      - 'experiments/matlab/aefc_ieee39_generator_measurement_bus_probe_v1.m'
      - 'experiments/audit/aefc_ieee39_generator_measurement_bus_probe_audit_v1.py'
permissions:
  contents: read
jobs:
  probe_generator_measurement_bus:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Capture the native Generators bus at runtime
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_generator_measurement_bus_probe_v1
      - name: Audit generator measurement bus runtime schema
        shell: bash
        run: |
          set -euo pipefail
          python experiments/audit/aefc_ieee39_generator_measurement_bus_probe_audit_v1.py
      - name: Archive generator measurement bus runtime probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-generator-measurement-bus-runtime-probe-v1
          path: |
            results/ieee39_safety_mapping/native_ieee39_generator_measurement_bus_probe_v1.json
            results/ieee39_safety_mapping/generator_measurement_bus_probe_audit_v1.json
            experiments/matlab/aefc_ieee39_generator_measurement_bus_probe_v1.m
            experiments/audit/aefc_ieee39_generator_measurement_bus_probe_audit_v1.py
          if-no-files-found: warn
          retention-days: 90
