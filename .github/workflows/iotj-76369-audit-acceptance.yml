name: IoT-J independent data and physical audit acceptance
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-audit-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        case: [39,118]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audited runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: Produce independent replay, optimizer, model and physical traces
        run: |
          python iotj_bridge/test_strict.py
          python iotj_bridge/strict_run.py --case ${{ matrix.case }} --seed 99 \
            --mode adv --episodes 5 --batch 32 --hidden 32 --latent 16 \
            --eval-episodes 3 --out results/audit_acceptance/case${{ matrix.case }}/adv_99.json
      - name: Validate 5 episode histories and SHA256 checkpoint
        run: |
          python iotj_bridge/strict_audit.py \
            --input results/audit_acceptance/case${{ matrix.case }} \
            --out results/audit_acceptance_audit/case${{ matrix.case }}
      - name: Independently recompute safety reentry, violations and censoring
        run: |
          python iotj_bridge/strict_physical_audit.py \
             --input results/audit_acceptance/case${{ matrix.case }}/adv_99.json \
             --out results/audit_acceptance_audit/case${{ matrix.case }}/physical.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-audit-acceptance-case${{ matrix.case }}-${{ github.sha }}
          path: |
            results/audit_acceptance/
            results/audit_acceptance_audit/
          if-no-files-found: warn
          retention-days: 90
