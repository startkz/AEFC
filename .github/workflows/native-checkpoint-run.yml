name: AEFC IEEE39 held-out checkpoint recovery
on:
  workflow_dispatch:
  push:
    branches: [experiment/native-checkpoint-recovery-20261021]
    paths: ['.github/workflows/native-checkpoint-run.yml']
permissions:
  contents: read
jobs:
  native-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {scenario: 1, tag: clean}
          - {scenario: 2, tag: knowledge}
          - {scenario: 4, tag: joint}
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Build fixed validated IEEE39 plant
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; mm=jsondecode(fileread(fullfile(pwd,'results','ieee39_r2024b','interface_mapping.json'))); assert(logical(mm.validated) && strcmp(mm.selection_policy,'paired-generator-physical-speed-v2')); aefc_ieee39_build_native_model
      - name: Run independent held-out seeds 20-39 and all recovery variants
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_checkpoint_recovery(${{ matrix.scenario }})
      - name: Archive all traces including failures
        shell: bash
        run: |
          set -euo pipefail
          cd results/p0_native_checkpoint/scenario_${{ matrix.scenario }}
          tar -czf raw-traces.tar.gz AEFC-Unprivileged AEFC-Quarantine AEFC-Checkpoint
          sha256sum raw-traces.tar.gz > raw-traces.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AEFC-Checkpoint-${{ matrix.tag }}-${{ github.sha }}
          path: results/p0_native_checkpoint/scenario_${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 90
