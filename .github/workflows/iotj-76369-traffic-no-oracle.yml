name: IoTJ traffic without oracle signal
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-traffic-no-oracle.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - run: python iotj_bridge/traffic_no_oracle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-no-oracle-traffic-${{ github.sha }}
          path: iotj_bridge/results/iotj_traffic_no_oracle/
          if-no-files-found: warn
