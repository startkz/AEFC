name: IoTJ R4 equal-byte delta/random/gradient Top-k (IEEE39, 1000 episodes)
on:
  push:
    branches: [experiment/iotj-r4-coordinate-ablation-20261111]
    paths: ['.github/workflows/iotj-r4-coordinate-full.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iotj-r4-coord-full
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        seed: [80,81,82,83,84,85,86,87,88,89]
        mode: [adv,ordinary,coord_random,coord_gradtopk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen dependencies
        run: |
          python -m pip install 'pandapower==3.2.1' 'numpy==2.2.6'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - name: 'Unit invariants: same dense displacement, byte parity and strict learner'
        run: |
          python -m py_compile iotj_bridge/strict_agent.py iotj_bridge/strict_run.py iotj_bridge/audit_coordinate_ablation.py
          python iotj_bridge/test_strict.py
          python iotj_bridge/test_coordinate_selection.py
      - name: 1000 episodes and 200 federated rounds with full real recovery traces
        shell: bash
        run: |
          set -euo pipefail
          out="results/iotj_r4_coordinate_raw/seed${{ matrix.seed }}/${{ matrix.mode }}.json"
          python iotj_bridge/strict_run.py \
            --case 39 --seed ${{ matrix.seed }} --mode ${{ matrix.mode }} \
            --hetero dim --attack clean --episodes 1000 \
            --clients 5 --malicious-clients 0 \
            --batch 256 --hidden 128 --latent 32 \
            --local-steps 5 --sharing-steps 2 --kappa .20 \
            --eval-episodes 10 --fixed-traffic --record-training-trace \
            --out "$out"
      - name: Verify raw budget and manifest/checkpoint SHA256 before archival
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("results/iotj_r4_coordinate_raw/seed${{ matrix.seed }}/${{ matrix.mode }}.json")
          d=json.loads(p.read_text())
          s=d['summary']; rounds=d['rounds']
          assert len(d['train_episodes'])==1000 and len(rounds)==200
          assert s['train_episodes']==1000 and s['eval_episodes']==10
          assert all(len(t['trace'])>0 for t in d['train_episodes'])
          assert all(sum(r['actual_serialized_client_bytes'])==r['uplink_bytes'] for r in rounds)
          meta=json.loads(p.with_suffix('.manifest.json').read_text())
          assert hashlib.sha256(p.read_bytes()).hexdigest()==meta['source_json_sha256']
          assert hashlib.sha256(p.with_suffix('.pt').read_bytes()).hexdigest()==meta['checkpoint_sha256']
          print("R4 1000/200/10 SHA256: PASS", p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-r4-coord-seed${{ matrix.seed }}-${{ matrix.mode }}-${{ github.sha }}
          path: results/iotj_r4_coordinate_raw/
          if-no-files-found: warn
          retention-days: 90
  audit:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy==2.2.6'
      - uses: actions/download-artifact@v4
        with:
          pattern: iotj-r4-coord-seed*
          path: r4-raw/
          merge-multiple: false
      - name: Fail-closed 40-run matched-seed, actual-byte and physical-recovery audit
        shell: bash
        run: |
          set -euo pipefail
          python iotj_bridge/audit_coordinate_ablation.py \
            --root r4-raw/ --out results/iotj_r4_coordinate/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-r4-coordinate-audited-${{ github.sha }}
          path: |
            r4-raw/
            results/iotj_r4_coordinate/
          if-no-files-found: warn
          retention-days: 90
      - name: Commit only 40/40 verified new coordinate-ablation results
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('results/iotj_r4_coordinate/r4_audit_report.json')
          d=json.loads(p.read_text())
          assert d['passed'] is True and d['audited_runs']==40 and d['expected_runs']==40
          assert len(d['git_source_shas'])==1
          assert d['aggregate_training_episode_rows']==40000
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/iotj_r4_coordinate/
          git commit -m 'IoT-J R4: write 40 SHA256-audited matched-byte AC coordinate results [skip ci]'
          git fetch origin experiment/iotj-r4-coordinate-ablation-20261111
          git rebase FETCH_HEAD
          git push origin HEAD:refs/heads/experiment/iotj-r4-coordinate-ablation-20261111
