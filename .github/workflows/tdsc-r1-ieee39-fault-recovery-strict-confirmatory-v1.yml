name: TDSC-R1 native IEEE39 Bus16 strict confirmatory replay v1
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-fault-recovery-strict-confirmatory-v1.yml'
      - 'experiments/matlab/aefc_ieee39_native_fault_recovery_strict_confirmatory_v1.m'
      - 'experiments/audit/aefc_ieee39_bus16_confirmatory_audit_v1.py'
      - 'experiments/matlab/AEFCNativeController.m'
      - 'experiments/matlab/aefc_native_certified_execution_step.m'
      - 'experiments/matlab/aefc_native_load_verified_state_contract.m'
      - 'configs/ieee39_native_fault_recovery_protocol_r1.json'
      - 'configs/ieee39_native_fault_recovery_protocol_r1_location_addendum.json'
      - 'configs/ieee39_unpriv_r1.json'
permissions:
  contents: read
jobs:
  native_bus16_strict_confirmatory:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical
          cache: true
      - name: Run original Bus16_1 fault on ten preregistered confirmatory seeds
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_native_fault_recovery_strict_confirmatory_v1
      - name: Audit paired exposure, strict refusal, physical reproducibility and seed independence
        shell: bash
        run: |
          set -euo pipefail
          python experiments/audit/aefc_ieee39_bus16_confirmatory_audit_v1.py
      - name: Archive all confirmatory trajectories and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-IEEE39-Bus16-strict-confirmatory-v1
          path: |
            results/ieee39_fault_recovery_r1/confirmatory_v1/
            experiments/matlab/aefc_ieee39_native_fault_recovery_strict_confirmatory_v1.m
            experiments/audit/aefc_ieee39_bus16_confirmatory_audit_v1.py
            experiments/matlab/AEFCNativeController.m
            experiments/matlab/aefc_native_certified_execution_step.m
            configs/ieee39_native_fault_recovery_protocol_r1.json
          if-no-files-found: warn
          retention-days: 90
