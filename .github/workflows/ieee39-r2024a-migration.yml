name: IEEE39 R2024a Migration Audit

on:
  workflow_dispatch:
  push:
    branches:
      - revision/trustworthy-heterogeneous-frl
    paths:
      - 'Figures/IEEE-39-bus-power.zip'
      - 'matlab/ieee39_migrate_r2024a.m'
      - '.github/workflows/ieee39-r2024a-migration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Figures/IEEE-39-bus-power.zip'
      - 'matlab/ieee39_migrate_r2024a.m'
      - '.github/workflows/ieee39-r2024a-migration.yml'

permissions:
  contents: read

jobs:
  migrate-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}
    steps:
      - name: Checkout revision branch
        uses: actions/checkout@v4

      - name: Verify MATLAB batch-license secret is configured
        shell: bash
        run: |
          if [ -z "${MLM_LICENSE_TOKEN}" ]; then
            echo "MLM_LICENSE_TOKEN repository secret is not configured."
            exit 2
          fi
          echo "MATLAB batch-license token is configured."

      - name: Set up MATLAB R2024a and Simulink electrical stack
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: >
            Simulink
            Simscape
            Simscape_Electrical
          cache: true

      - name: Migrate model and perform real short simulation
        id: migrate
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab'); ieee39_migrate_r2024a

      - name: Upload migration model and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ieee39-r2024a-migration-audit
          path: build/ieee39_r2024a
          if-no-files-found: warn
          retention-days: 14
