name: TDSC-R1 corrected native IEEE39 four-Pref local observability probe v4
on:
  workflow_dispatch:
  push:
    branches: [experiment/tdsc-r1-ieee39-stress-recovery-20261125]
    paths:
      - '.github/workflows/tdsc-r1-ieee39-observability-v4.yml'
      - 'experiments/matlab/aefc_ieee39_local_observability_probe_v4.m'
permissions:
  contents: read
jobs:
  native_4pref_10speed_local_diagnostic_v4:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024b
          products: Simulink Simscape Simscape_Electrical Simulink_Control_Design
          cache: true
      - name: Compute local A B C and numerical observability rank with four true Pref input ports
        uses: matlab-actions/run-command@v3
        with:
          command: addpath('matlab_r2024b'); addpath('experiments/matlab'); aefc_ieee39_bootstrap; aefc_ieee39_local_observability_probe_v4
      - name: Verify actual diagnostic output exists and global guarantees are not fabricated
        shell: bash
        run: |
          set -euo pipefail
          test -s results/ieee39_safety_mapping/native_local_observability_probe_v4.json
          python - <<'PY'
          import json
          q=json.load(open('results/ieee39_safety_mapping/native_local_observability_probe_v4.json'))
          assert q['full_network_observer_verified'] is False
          assert q['bounded_nonlinear_model_residual_verified'] is False
          assert q['guaranteed_intersample_tube'] is False
          assert q['status'] in ('DIAGNOSTIC_ATTEMPTS_COMPLETED','NO_SIMULINK_CONTROL_DESIGN_LICENSE')
          print(json.dumps(q,indent=2))
          if 'attempts' in q:
              assert len(q['attempts'])==2
          PY
      - name: Archive corrected JSON and local matrices or explicit diagnostic failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TDSC-R1-native-4input-local-observability-v4-${{ github.sha }}
          path: |
            results/ieee39_safety_mapping/native_local_observability_probe_v4.json
            results/ieee39_safety_mapping/native_local_abc_t*.mat
            experiments/matlab/aefc_ieee39_local_observability_probe_v4.m
          if-no-files-found: warn
          retention-days: 90
