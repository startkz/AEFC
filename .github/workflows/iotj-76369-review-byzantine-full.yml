name: IoTJ 76369 Reviewer full-budget coordinated M over N Byzantine
on:
  push:
    branches: [experiment/iotj-76369-ac-grid-bridge-20261102]
    paths: ['.github/workflows/iotj-76369-review-byzantine-full.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coalition:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [39,118]
        seed: [80,81,82,83,84]
        m: [1,2,3]
        defense: [uncapped,capped]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install 'pandapower==3.2.1'
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
      - run: python iotj_bridge/test_strict.py
      - name: Full budget coordinated malicious clients, actual M/N
        shell: bash
        run: |
          set -euo pipefail
          out="results/iotj_review_coalition/case${{ matrix.case }}/seed${{ matrix.seed }}/M${{ matrix.m }}_N10_${{ matrix.defense }}.json"
          args=(--case ${{ matrix.case }} --seed ${{ matrix.seed }} --mode adv --hetero dim --attack joint --clients 10 --malicious-clients ${{ matrix.m }} --episodes 1000 --batch 256 --hidden 128 --latent 32 --eval-episodes 10 --local-steps 5 --sharing-steps 2 --kappa 0.2 --fixed-traffic)
          if [ "${{ matrix.defense }}" = capped ]; then
            args+=(--weight-cap 0.20)
          fi
          python iotj_bridge/strict_run.py "${args[@]}" --out "$out"
      - name: Verify actual 1000 episode traces, attacked M, byte-accounting and checkpoint
        run: |
          python iotj_bridge/strict_audit.py --input results/iotj_review_coalition/case${{ matrix.case }}/seed${{ matrix.seed }} --out results/iotj_review_coalition_audit/case${{ matrix.case }}/seed${{ matrix.seed }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iotj-coalition-case${{ matrix.case }}-seed${{ matrix.seed }}-M${{ matrix.m }}-N10-${{ matrix.defense }}-${{ github.sha }}
          path: |
            results/iotj_review_coalition/
            results/iotj_review_coalition_audit/
          if-no-files-found: warn
          retention-days: 90
